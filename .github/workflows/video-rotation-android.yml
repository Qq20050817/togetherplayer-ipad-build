name: Verify and build Android rotation and watch memory 0.6.61
on:
  push:
    branches: [feat/android-video-rotation-20261022]
    paths: ['android/**', '.github/workflows/video-rotation-android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: video-rotation-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle offline voice model
        run: |
          curl -fL --retry 2 --max-time 180 https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip -o android/app/src/main/assets/voice-cn-model.zip
          echo '3af8b0e7e0f835ae9d414ce5df580237a3cfb08d586c9fbbb0f7ff29ad5b14ba  android/app/src/main/assets/voice-cn-model.zip' | sha256sum -c -
      - name: Generate four-quadrant rotation video fixture
        run: |
          mkdir -p android/app/src/androidTest/assets
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          ffmpeg -y -hide_banner -loglevel error -f lavfi -i 'color=c=red:s=640x360:r=24:d=30,drawbox=x=320:y=0:w=320:h=180:color=green:t=fill,drawbox=x=0:y=180:w=320:h=180:color=blue:t=fill,drawbox=x=320:y=180:w=320:h=180:color=yellow:t=fill' -c:v libx264 -preset ultrafast -pix_fmt yuv420p android/app/src/androidTest/assets/rotation-pattern.mp4
      - name: Unit tests and APK build
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Enable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd android && gradle --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.together.poc.WatchMemoryPersistenceTest,dev.together.poc.VideoRotationInterfaceTest
            mkdir -p rotation-screenshots
            adb pull /sdcard/Android/data/dev.together.poc.fluency/files/rotation-90.png rotation-screenshots/ || true
      - name: Publish verified APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p delivery
          cp android/app/build/outputs/apk/debug/app-debug.apk delivery/TogetherPlayer-Android-0.6.61.apk
          sha256sum delivery/*.apk > delivery/SHA256SUMS.txt
          printf 'Source: %s\nCI: https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > delivery/BUILD.txt
          gh release create video-rotation-android-0.6.61-${{ github.run_id }} delivery/* --target "$GITHUB_SHA" --prerelease --title 'Android 0.6.61 watch memory preview' --notes 'Video rotation, unified subtitle import and watch-memory preview. Unit and persistence instrumentation checks passed. Real two-device playback remains to be checked. Keeps the existing preview package identity.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-rotation-android-validation
          path: |
            delivery/\n            android/rotation-screenshots/
            android/app/build/reports/tests/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
