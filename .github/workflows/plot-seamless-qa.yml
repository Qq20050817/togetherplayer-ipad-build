name: Verify story-turn playback, AI, and IPA package
on:
  push:
    branches: [fix/plot-solo-20261013, fix/plot-reconnect-subtitle-memory-20261013, fix/plot-memory-autoprompt-20261013, feat/ipad-visual-plot-prototype-20261013, fix/ipad-embedded-subtitle-selection-20261013, fix/ipad-visual-frame-sampling-20261013, fix/ipad-native-caption-autoprompt-20261014, feat/ipad-story-question-checkpoints-20261014, build/ipad-story-checkpoints-macos15-20261014, fix/ipad-seek-burst-stability-20261014, feat/ipad-native-subtitle-ai-index-20261014]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: story-turn-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ipad:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select supported Xcode 26 on macOS 15 runner
        run: |
          set -euo pipefail
          for version in 26.3 26.2 26.1.1 26.0.1; do
            developer="/Applications/Xcode_${version}.app/Contents/Developer"
            if [ -d "$developer" ]; then
              sudo xcode-select -s "$developer"
              xcodebuild -version
              exit 0
            fi
          done
          echo 'Xcode 26 unavailable on this macOS image' >&2
          exit 1
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Build iPad candidate
        run: |
          set -euo pipefail
          python3 tools/resolve_apple_packages.py -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -derivedDataPath plot-build
          python3 tools/patch_prism_swift61.py plot-build/SourcePackages/checkouts/PrismCore
          xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -configuration Release -destination 'generic/platform=iOS' -derivedDataPath plot-build CODE_SIGNING_ALLOWED=NO build
      - name: Choose stable iPad simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > /tmp/plot-simulators.json
          DEVICE_ID=$(python3 -c 'import json; d=json.load(open("/tmp/plot-simulators.json"))["devices"]; print(next(x["udid"] for a in d.values() for x in a if "iPad" in x["name"]))')
          echo "SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Validate all native core tests serially
        run: |
          set -euo pipefail
          xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath plot-build CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO \
            -only-testing:TogetherPoCCoreTests \
            -retry-tests-on-failure \
            test
      - name: Validate complete watch UI regressions serially
        run: |
          set -euo pipefail
          xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath plot-build CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO \
            -only-testing:TogetherPoCUITests/WatchInterfaceTests/testBlockingPlotQuestionPresentsAutomaticallyInWatchPage \
            -only-testing:TogetherPoCUITests/WatchInterfaceTests/testQuestionPauseSettingSurvivesPanelDismissalAndRelaunch \
            -only-testing:TogetherPoCUITests/WatchInterfaceTests/testPlotAIEntrancesRemainVisibleInWatchAndFullscreen \
            -only-testing:TogetherPoCUITests/WatchInterfaceTests/testPlotIntelligencePreviewKeepsFullscreenAndCloudOff \
            -retry-tests-on-failure \
            test
      - name: Package verified unsigned IPA
        run: |
          set -euo pipefail
          python3 tools/package_unsigned_ipa.py plot-build/Build/Products/Release-iphoneos/TogetherPoC.app plot-delivery/TogetherPlayer-0.6.13-NativeSubtitleAI-EXPERIMENTAL-unsigned.ipa --notices ios/TogetherPoC.swiftpm/Licenses
          shasum -a 256 plot-delivery/TogetherPlayer-0.6.13-NativeSubtitleAI-EXPERIMENTAL-unsigned.ipa > plot-delivery/SHA256SUMS.txt
          printf "Source branch: %s\nSource SHA: %s\nCI: iPad build and regression tests succeeded\n" "$GITHUB_REF_NAME" "$GITHUB_SHA" > plot-delivery/BUILD.txt
          printf "Experimental selected HLS WebVTT full subtitle index for AI story-checkpoint planning, with watched-only prompts and native display fallback; PGS image tracks and non-HLS subtitle extraction unsupported. Experimental iPad rapid-seek coalescing and locally responsive host controls; real-device seek-burst and network acceptance still required. Experimental on-device Vision sampling defaults OFF; frame classification is coarse. Host-clock sampling, native subtitle watchdog, and full-subtitle index/duration fallback checkpoint prompts need real-device 4K/HDR acceptance; not yet proven on all source types. Checkpoints never supply future text to AI. Real-device reconnect and Apple AI/ChatGPT OAuth acceptance pending. Existing server untouched.\n" >> plot-delivery/BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TogetherPlayer-iPad-v0.6.13-NativeSubtitleAI-EXPERIMENTAL-candidate
          path: plot-delivery/
          retention-days: 7

      - name: Collect test diagnostics
        if: always()
        run: |
          mkdir -p plot-diagnostics
          for result in plot-build/Logs/Test/*.xcresult; do
            [ -d "$result" ] || continue
            xcrun xcresulttool get test-results summary --path "$result" > "plot-diagnostics/$(basename "$result").json" || true
          done
          cp -R "$HOME/Library/Logs/DiagnosticReports" plot-diagnostics/crashes 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plot-story-turn-test-diagnostics
          path: plot-diagnostics/
          retention-days: 7
  publish_direct_ipa:
    name: Publish verified direct IPA (no ZIP)
    needs: ipad
    if: ${{ success() && github.ref_name == 'feat/ipad-native-subtitle-ai-index-20261014' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Verify exact current-run IPA and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verified
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name TogetherPlayer-iPad-v0.6.13-NativeSubtitleAI-EXPERIMENTAL-candidate --dir verified
          test -f verified/BUILD.txt
          grep -Fx "Source SHA: $GITHUB_SHA" verified/BUILD.txt
          cd verified
          sed 's|^plot-delivery/||' SHA256SUMS.txt | sha256sum -c -
          test -f TogetherPlayer-0.6.13-NativeSubtitleAI-EXPERIMENTAL-unsigned.ipa
      - name: Release direct unsigned IPA after all regressions pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.6.13-native-subtitle-ai-preview-ipad"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite existing assets." >&2
            exit 1
          fi
          gh release create "$tag" \
            verified/TogetherPlayer-0.6.13-NativeSubtitleAI-EXPERIMENTAL-unsigned.ipa \
            verified/SHA256SUMS.txt verified/BUILD.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease \
            --title "TogetherPlayer iPad 0.6.13 · Native subtitle AI indexing and seek stability" \
            --notes "Unsigned experimental iPad IPA delivered directly, without a ZIP download. Based on verified 0.6.11 story-checkpoints code. Selected embedded HLS WebVTT subtitle rendition can be locally indexed for spoiler-safe plot checkpoints, guarded by actual watched progress. Protected streams, PGS image subtitles and unsupported subtitle encodings remain limited. Rapid-seek coalescing, accumulated 10s skipping, optimistic local host playback/pause, and immediate local 2x hold. GitHub build, core tests, and focused UI regressions required before publication. Real-device 4K/HDR seek-burst and network acceptance still pending. The existing server, Android app, other services and installed clients are not modified. Sign this unsigned IPA with the user's existing trusted signing method before installation."
