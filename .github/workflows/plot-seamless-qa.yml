name: Verify story-turn playback, AI, and IPA package
on:
  push:
    branches: [fix/plot-solo-20261013, fix/plot-reconnect-subtitle-memory-20261013, fix/plot-memory-autoprompt-20261013, feat/ipad-visual-plot-prototype-20261013, fix/ipad-embedded-subtitle-selection-20261013, fix/ipad-visual-frame-sampling-20261013, fix/ipad-native-caption-autoprompt-20261014, feat/ipad-story-question-checkpoints-20261014, build/ipad-story-checkpoints-macos15-20261014, fix/ipad-seek-burst-stability-20261014, feat/ipad-native-subtitle-ai-index-20261014, delivery/ipad-0.6.14-story-graph-verified-20261014, feat/ipad-pgs-ai-only-srt-20261014, feat/ipad-pgs-bitmap-overlay-prototype-20261014, feat/ipad-pgs-overlay-view-wiring-20261014, feat/ipad-pgs-original-decoder-local-20261014, feat/ipad-pgs-local-robustness-20261014]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: story-turn-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ipad:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select supported Xcode 26 on macOS 15 runner
        run: |
          set -euo pipefail
          for version in 26.3 26.2 26.1.1 26.0.1; do
            developer="/Applications/Xcode_${version}.app/Contents/Developer"
            if [ -d "$developer" ]; then
              sudo xcode-select -s "$developer"
              xcodebuild -version
              exit 0
            fi
          done
          echo 'Xcode 26 unavailable on this macOS image' >&2
          exit 1
      - name: Verify original PGS bitmap compositor smoke
        run: |
          set -euo pipefail
          swiftc -parse-as-library ios/TogetherPoC/PGSBitmapComposition.swift tools/pgs_bitmap_composition_smoke.swift -o /tmp/pgs-bitmap-composition-smoke
          /tmp/pgs-bitmap-composition-smoke
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Build iPad candidate
        run: |
          set -euo pipefail
          python3 tools/resolve_apple_packages.py -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -derivedDataPath plot-build
          python3 tools/patch_prism_swift61.py plot-build/SourcePackages/checkouts/PrismCore
          xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -configuration Release -destination 'generic/platform=iOS' -derivedDataPath plot-build CODE_SIGNING_ALLOWED=NO build
      - name: Choose stable iPad simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > /tmp/plot-simulators.json
          DEVICE_ID=$(python3 -c 'import json; d=json.load(open("/tmp/plot-simulators.json"))["devices"]; print(next(x["udid"] for a in d.values() for x in a if "iPad" in x["name"]))')
          echo "SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Validate all native core tests serially
        run: |
          set -euo pipefail
          xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath plot-build CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO \
            -only-testing:TogetherPoCCoreTests \
            -retry-tests-on-failure \
            test
      - name: Validate complete watch UI regressions serially
        run: |
          set -euo pipefail
          xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath plot-build CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO \
            -only-testing:TogetherPoCUITests/WatchInterfaceTests/testBlockingPlotQuestionPresentsAutomaticallyInWatchPage \
            -only-testing:TogetherPoCUITests/WatchInterfaceTests/testQuestionPauseSettingSurvivesPanelDismissalAndRelaunch \
            -only-testing:TogetherPoCUITests/WatchInterfaceTests/testPlotAIEntrancesRemainVisibleInWatchAndFullscreen \
            -only-testing:TogetherPoCUITests/WatchInterfaceTests/testPlotIntelligencePreviewKeepsFullscreenAndCloudOff \
            -retry-tests-on-failure \
            test
      - name: Package verified unsigned IPA
        run: |
          set -euo pipefail
          python3 tools/package_unsigned_ipa.py plot-build/Build/Products/Release-iphoneos/TogetherPoC.app plot-delivery/TogetherPlayer-0.6.15-PGSLocal-EXPERIMENTAL-unsigned.ipa --notices ios/TogetherPoC.swiftpm/Licenses
          shasum -a 256 plot-delivery/TogetherPlayer-0.6.15-PGSLocal-EXPERIMENTAL-unsigned.ipa > plot-delivery/SHA256SUMS.txt
          printf "Source branch: %s\nSource SHA: %s\nCI: iPad build and regression tests succeeded\n" "$GITHUB_REF_NAME" "$GITHUB_SHA" > plot-delivery/BUILD.txt
          printf "Experimental LOCAL-file-only original PGS bitmap: bounded 256 MiB read and 16M decoded pixels, unique PGS stream, image palette playback overlay, and separate AI-only OCR SRT. Not for remote HTTP, Baidu, SMB or NAS as original PGS overlay. Not verified on a real iPad or with full-length PGS movies; prior 0.6.14 is preserved. No Android/server/router changes.\\n" >> plot-delivery/BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TogetherPlayer-iPad-v0.6.15-PGSLocal-EXPERIMENTAL-candidate
          path: plot-delivery/
          retention-days: 7

      - name: Collect test diagnostics
        if: always()
        run: |
          mkdir -p plot-diagnostics
          for result in plot-build/Logs/Test/*.xcresult; do
            [ -d "$result" ] || continue
            xcrun xcresulttool get test-results summary --path "$result" > "plot-diagnostics/$(basename "$result").json" || true
          done
          cp -R "$HOME/Library/Logs/DiagnosticReports" plot-diagnostics/crashes 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plot-story-turn-test-diagnostics
          path: plot-diagnostics/
          retention-days: 7
  publish_direct_ipa:
    name: Publish verified direct IPA (no ZIP)
    needs: ipad
    if: ${{ success() && github.ref_name == 'feat/ipad-pgs-local-robustness-20261014' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Verify exact current-run IPA and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verified
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name TogetherPlayer-iPad-v0.6.15-PGSLocal-EXPERIMENTAL-candidate --dir verified
          test -f verified/BUILD.txt
          grep -Fx "Source SHA: $GITHUB_SHA" verified/BUILD.txt
          cd verified
          sed 's|plot-delivery/||g' SHA256SUMS.txt | sha256sum -c -
          test -f TogetherPlayer-0.6.15-PGSLocal-EXPERIMENTAL-unsigned.ipa
      - name: Release direct unsigned IPA after all regressions pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.6.15-pgs-local-preview-ipad-20261014"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite existing assets." >&2
            exit 1
          fi
          gh release create "$tag" \
            verified/TogetherPlayer-0.6.15-PGSLocal-EXPERIMENTAL-unsigned.ipa \
            verified/SHA256SUMS.txt verified/BUILD.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease \
            --title "TogetherPlayer iPad 0.6.15 · Local-only original PGS bitmap preview" \
            --notes "UNSIGNED EXPERIMENTAL direct IPA, no ZIP. Local file PGS original palette bitmap overlay plus separate AI-only OCR SRT path. Original image extraction is bounded (256 MiB input, 16 million pixels): some movie duration may fall back to normal selected native captions. Raw bitmap feature does not yet support Baidu network, router SMB, or remote HTTP source; playback on a physical iPad and all 4K/HDR cases still need user acceptance. No existing 0.6.14 assets, Android, server, router, or active services are changed. Sign with the user\x27s trusted signing method before installing."
