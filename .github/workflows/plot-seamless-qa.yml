name: Verify seamless plot prompts and iPad package
on:
  push:
    branches: [fix/plot-seamless-autoprompt-20261013]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ipad:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Build iPad candidate
        run: |
          set -euo pipefail
          python3 tools/resolve_apple_packages.py -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -derivedDataPath plot-build
          python3 tools/patch_prism_swift61.py plot-build/SourcePackages/checkouts/PrismCore
          xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -configuration Release -destination 'generic/platform=iOS' -derivedDataPath plot-build CODE_SIGNING_ALLOWED=NO build
      - name: Validate plot route, OAuth, event cues, and UI entrances
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > /tmp/plot-simulators.json
          DEVICE_ID=$(python3 -c 'import json; d=json.load(open("/tmp/plot-simulators.json"))["devices"]; print(next(x["udid"] for a in d.values() for x in a if "iPad" in x["name"]))')
          xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath plot-build CODE_SIGNING_ALLOWED=NO \
            -only-testing:TogetherPoCCoreTests \
            -only-testing:TogetherPoCUITests/WatchInterfaceTests/testPlotAIEntrancesRemainVisibleInWatchAndFullscreen \
            -only-testing:TogetherPoCUITests/WatchInterfaceTests/testPlotIntelligencePreviewKeepsFullscreenAndCloudOff \
            test
      - name: Package verified unsigned IPA
        run: |
          set -euo pipefail
          python3 tools/package_unsigned_ipa.py plot-build/Build/Products/Release-iphoneos/TogetherPoC.app plot-delivery/TogetherPlayer-0.6.3-SeamlessPlot-unsigned.ipa --notices ios/TogetherPoC.swiftpm/Licenses
          shasum -a 256 plot-delivery/TogetherPlayer-0.6.3-SeamlessPlot-unsigned.ipa > plot-delivery/SHA256SUMS.txt
          printf "Source branch: %s\nSource SHA: %s\nCI: iPad build and regression tests succeeded\n" "$GITHUB_REF_NAME" "$GITHUB_SHA" > plot-delivery/BUILD.txt
          printf "Requires in-person Apple AI and official ChatGPT OAuth validation before release. No server deployed.\n" >> plot-delivery/BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TogetherPlayer-iPad-v0.6.3-SeamlessPlot-candidate
          path: plot-delivery/
          retention-days: 7
