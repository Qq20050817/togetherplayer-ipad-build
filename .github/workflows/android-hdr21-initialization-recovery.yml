name: Android HDR21 hardware initialization recovery (independent)
on:
  push:
    branches: [fix/android-main10-reference-0621-20261112]
    paths: ['android/**', '.github/workflows/android-hdr21-initialization-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hdr21-initialization-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ORG_GRADLE_PROJECT_deliveryCompressedNative: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Check independent HDR hardware trial identity
        run: |
          grep -F 'applicationIdSuffix = ".hdrtrial21"' android/app/build.gradle.kts
          grep -F 'versionName = "0.6.60.21"' android/app/build.gradle.kts
          grep -F 'TogetherPlayer 硬解兼容测试' android/app/src/main/AndroidManifest.xml
      - name: Bundle verified offline voice model
        run: |
          mkdir -p android/app/src/main/assets
          curl -fL --retry 2 --max-time 180 https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip -o android/app/src/main/assets/voice-cn-model.zip
          echo '3af8b0e7e0f835ae9d414ce5df580237a3cfb08d586c9fbbb0f7ff29ad5b14ba  android/app/src/main/assets/voice-cn-model.zip' | sha256sum -c -
      - name: Run JVM tests and compile emulator app and instrumented tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify diagnostic UI and independent emulator install
        id: emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            python3 android/emulator-preflight.py
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm list packages | grep -x 'package:dev.together.poc.hdrtrial21'
            adb shell am start -W -n dev.together.poc.hdrtrial21/dev.together.poc.MainActivity
            adb shell pidof dev.together.poc.hdrtrial21
            gradle -p android --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class='dev.together.poc.HevcHardwareInitializationTest,dev.together.poc.HevcHdrCapabilityTest,dev.together.poc.HdrDiagnosticReportInstrumentedTest,dev.together.poc.CompatibleHttpRecoveryTest'
      - name: Preserve JVM and native test reports before the ARM64 clean build
        if: always()
        run: |
          mkdir -p delivery/test-evidence
          cp -a android/app/build/test-results delivery/test-evidence/jvm
          if [ -d android/app/build/outputs/androidTest-results ]; then
            cp -a android/app/build/outputs/androidTest-results delivery/test-evidence/native
          fi
      - name: Build separate ARM64 tablet APK
        working-directory: android
        run: gradle --no-daemon -PdeliveryArm64=true clean assembleDebug
      - name: Verify APK ABI identity, bundle hash and limited size
        run: |
          mkdir -p delivery
          cp android/app/build/outputs/apk/debug/app-debug.apk delivery/TogetherPlayer-Android-0.6.60.21-Hardware-Initialization-Trial.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)"
          "$aapt" dump badging delivery/*.apk > delivery/package-identity.txt
          python3 - <<'PY'
          import zipfile,pathlib,hashlib
          p=pathlib.Path('delivery/TogetherPlayer-Android-0.6.60.21-Hardware-Initialization-Trial.apk')
          assert p.stat().st_size < 100*1024*1024
          with zipfile.ZipFile(p) as z:
              libs=[x for x in z.infolist() if x.filename.startswith('lib/')]
              assert libs and all(x.filename.startswith('lib/arm64-v8a/') and x.compress_type==8 for x in libs)
              assert hashlib.sha256(z.read('assets/voice-cn-model.zip')).hexdigest()=='3af8b0e7e0f835ae9d414ce5df580237a3cfb08d586c9fbbb0f7ff29ad5b14ba'
          identity=pathlib.Path('delivery/package-identity.txt').read_text()
          assert "name='dev.together.poc.hdrtrial21'" in identity
          assert "versionName='0.6.60.21'" in identity
          PY
      - name: Record exact APK hash and emulator status
        run: |
          (cd delivery && sha256sum *.apk > SHA256SUMS.txt)
          echo 'emulator=${{ steps.emulator.outcome }}' > delivery/emulator-status.txt
      - name: Upload independent hardware trial package and test evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-hdr21-initialization-trial
          path: |
            delivery/
            android/app/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore

  strict-picture-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify unchanged Main10 movie-rate colors, audio, clock and fullscreen behavior
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            python3 android/emulator-preflight.py
            gradle -p android --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class='dev.together.poc.CompatiblePlaybackTest#main10MovieRateHttpKeepsColorsAudioAndPositionDuringCatchup'
      - name: Upload strict picture evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hdr21-strict-picture-evidence
          path: |
            android/app/build/outputs/androidTest-results/
            android/app/build/test-results/
          retention-days: 14
          if-no-files-found: ignore
