name: Verify iPad 0.6.53 USB AI subtitles
on:
  push:
    branches:
      - feat/ipad-router-subtitles-ai-20261019
    paths:
      - 'ios/**'
      - '.github/workflows/ipad-ai-router-usb-subtitles.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ipad-ai-router-subtitles-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ipad:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact branch revision
        run: |
          set -euo pipefail
          actual=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')
          test "$actual" = "$GITHUB_SHA"
      - name: Select Xcode 26
        run: |
          set -euo pipefail
          for v in 26.3 26.2 26.1.1 26.0.1; do
            d="/Applications/Xcode_${v}.app/Contents/Developer"
            if [ -d "$d" ]; then sudo xcode-select -s "$d"; break; fi
          done
          xcodebuild -version
      - name: Generate project and resolve dependencies
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
          python3 tools/resolve_apple_packages.py -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -derivedDataPath usb-ai-build
          python3 tools/patch_prism_swift61.py usb-ai-build/SourcePackages/checkouts/PrismCore
      - name: Build Release for iPad
        run: |
          set -euo pipefail
          xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -configuration Release -destination 'generic/platform=iOS' -derivedDataPath usb-ai-build CODE_SIGNING_ALLOWED=NO build
      - name: Run credits, reconnect, subtitle and question-bank regression tests
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > /tmp/together-ipad-http-devices.json
          DEVICE_ID=$(python3 -c 'import json; d=json.load(open("/tmp/together-ipad-http-devices.json"))["devices"]; print(next(x["udid"] for a in d.values() for x in a if "iPad" in x["name"]))')
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath usb-ai-build CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -only-testing:TogetherPoCCoreTests/FilmQuestionBankRuntimeTests -only-testing:TogetherPoCCoreTests/FilmBankGenreInstructionsTests -only-testing:TogetherPoCCoreTests/FilmSourceTitleTests -only-testing:TogetherPoCCoreTests/FilmBankV2Tests -only-testing:TogetherPoCCoreTests/FilmQuestionBankTests -only-testing:TogetherPoCCoreTests/FilmMaterialRemoteTests -only-testing:TogetherPoCCoreTests/PlaybackControlSafetyTests -only-testing:TogetherPoCCoreTests/P2PFastPathGateTests -only-testing:TogetherPoCCoreTests/RouterUSBSubtitleCatalogTests test
      - name: Verify preserved P2P standalone transport decision gates
        run: |
          set -euo pipefail
          xcrun swiftc ios/TogetherPoC/P2PFastPathGate.swift ios/tests/P2PFastPathStandalone.swift -o /tmp/together-p2p-fastpath
          /tmp/together-p2p-fastpath
      - name: Package direct unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p usb-ai-delivery
          python3 tools/package_unsigned_ipa.py usb-ai-build/Build/Products/Release-iphoneos/TogetherPoC.app usb-ai-delivery/TogetherPlayer-iPad-v0.6.53-Build113-unsigned.ipa --notices ios/TogetherPoC.swiftpm/Licenses
          (cd usb-ai-delivery && shasum -a 256 TogetherPlayer-iPad-v0.6.53-Build113-unsigned.ipa > SHA256SUMS.txt)
          printf 'Source branch: %s\nSource SHA: %s\nTests: signed USB subtitle catalog, film materials, story bank, playback recovery, P2P gate\nExcluded baseline RoomMovieSelectionTests failing before finale fix (build 39069382451)\nSigning: required before install; P2P preserved from validated release SHA b9dc76e12de4d07c758fb442239f6ef0da829289\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" > usb-ai-delivery/BUILD.txt
      - name: Upload validated unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: TogetherPlayer-iPad-0.6.53-Router-USB-AI-Subtitles
          path: usb-ai-delivery/
          retention-days: 7
      - name: Publish verified router USB AI subtitles 0.6.53 IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=ipad-v0.6.53-router-usb-ai-subtitles-20261019
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite"; exit 1
          fi
          gh release create "$tag" usb-ai-delivery/TogetherPlayer-iPad-v0.6.53-Build113-unsigned.ipa usb-ai-delivery/SHA256SUMS.txt usb-ai-delivery/BUILD.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "TogetherPlayer iPad 0.6.53: Router USB AI subtitles" --prerelease \
            --notes "Built from verified 0.6.51 P2P and finale baseline c7c7d8a. Adds signed router USB subtitle catalog for AI-only film materials; local File import stays available. 5MB cap and signed same-folder URL validation. Router server must enable ?subtitles=1 separately; no router service was modified. Physical device verification still pending. Unsigned IPA needs signing."
