name: MovieMind UI verification on unchanged application source
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: moviemind-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 55
    steps:
      - name: Select available Xcode 26
        run: |
          set -euo pipefail
          for version in 26.3 26.2 26.1.1 26.0.1; do
            dev="/Applications/Xcode_${version}.app/Contents/Developer"
            if [ -d "$dev" ]; then sudo xcode-select -s "$dev"; xcodebuild -version; exit 0; fi
          done
          echo 'Required Xcode 26 image not installed' >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify packaged WebRTC state ordering
        run: node tools/test_p2p_channel_state.mjs
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Resolve pinned PrismCore and MPVKit
        run: |
          python3 tools/resolve_apple_packages.py -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -derivedDataPath build
          python3 tools/patch_prism_swift61.py build/SourcePackages/checkouts/PrismCore
      - name: Run MovieMind entry and unchanged fullscreen UI checks
        run: |
          set -o pipefail
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if "iPad" in x["name"]))')"
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -configuration Debug -destination "platform=iOS Simulator,id=$device" -derivedDataPath build -resultBundlePath moviemind-ui-results.xcresult -parallel-testing-enabled NO -only-testing:TogetherPoCUITests/MovieMindUITests -only-testing:TogetherPoCUITests/WatchInterfaceTests/testFullscreenProgressAndRealMovieAdjustment CODE_SIGNING_ALLOWED=NO test 2>&1 | tee moviemind-ui.log
      - name: Report structured UI results and compiler diagnostics
        if: always()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import json,subprocess
          def annotation(level,title,message):
              message=message.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f'::{level} title={title}::{message}')
          p=Path('moviemind-ui.log')
          lines=p.read_text(errors='replace').splitlines() if p.exists() else []
          for line in [s for s in lines if 'error:' in s or ('failed' in s.lower() and ('test case' in s.lower() or 'testcase' in s.lower())) or '** TEST ' in s][-25:]:
              annotation('notice','UI diagnostic',line[:6000])
          bundle=Path('moviemind-ui-results.xcresult')
          if bundle.exists():
              result=subprocess.run(['xcrun','xcresulttool','get','test-results','summary','--path',str(bundle)],capture_output=True,text=True)
              if result.returncode==0:
                  data=json.loads(result.stdout)
                  Path('moviemind-ui-summary.json').write_text(json.dumps(data,indent=2))
                  counts={k:v for k,v in data.items() if 'test' in k.lower() and isinstance(v,(int,str))}
                  annotation('notice','UI result summary',json.dumps(counts))
                  for failure in data.get('testFailures',[]):annotation('notice','UI failure',json.dumps(failure)[:6000])
              else:annotation('notice','UI result tool',result.stderr[:1500])
          PYCODE
      - name: Verify compiled simulator version
        if: always()
        run: |
          python3 - <<'PYCODE'
          import plistlib
          with open('build/Build/Products/Debug-iphonesimulator/TogetherPoC.app/Info.plist','rb') as f:p=plistlib.load(f)
          assert p['CFBundleShortVersionString']=='0.6.85'
          assert str(p['CFBundleVersion'])=='145'
          assert p['CFBundleIdentifier']=='dev.together.poc.asrtest'
          print('::notice title=Compiled version::0.6.85 /145 /dev.together.poc.asrtest')
          PYCODE
      - name: Preserve textual UI evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moviemind-ui-verification-text-${{ github.run_attempt }}
          path: |
            moviemind-ui.log
            moviemind-ui-summary.json
          if-no-files-found: ignore
          retention-days: 7
