name: MovieMind iPad0.6.87 UI companion for immutable verified device and native source
permissions:
  contents: read
concurrency:
  group: moviemind-ipad-package-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ui:
    runs-on: macos-15-intel
    timeout-minutes: 55
    steps:
    - name: Select available Xcode 26
      run: "set -euo pipefail\nfor version in 26.3 26.2 26.1.1 26.0.1; do\n  dev=\"/Applications/Xcode_$version.app/Contents/Developer\"\n  if\
        \ [ -d \"$dev\" ]; then sudo xcode-select -s \"$dev\"; xcodebuild -version; exit 0; fi\ndone\necho 'Required Xcode 26 image not installed'\
        \ >&2\nexit 1\n"
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Verify frozen client source and existing WebRTC ordering
      run: 'test "$(git rev-parse HEAD:ios)" = "d20487327ebd2fb2701fed143781bdda5cfc8e58"

        git diff --exit-code 990b6494b27821d76ccfa7d6270465dd719df494 HEAD -- ios '':(exclude)ios/UITests/MovieMindUITests.swift''

        node tools/test_p2p_channel_state.mjs

        '
    - name: Generate Xcode project
      run: 'brew install xcodegen

        xcodegen generate --spec ios/project.yml

        '
    - name: Resolve pinned PrismCore and MPVKit
      run: 'python3 tools/resolve_apple_packages.py -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -derivedDataPath build

        python3 tools/patch_prism_swift61.py build/SourcePackages/checkouts/PrismCore

        '
    - name: Run native record review edit recommendation and existing fullscreen UI workflows
      run: "set -o pipefail\npython3 tools/moviemind_ui_fixture.py > /tmp/moviemind-ui-fixture.log 2>&1 &\nfixture_pid=$!\ntrap 'kill \"$fixture_pid\"\
        \ 2>/dev/null || true' EXIT\npython3 - <<'PYFIXTURE'\nimport http.client,time,subprocess\nfrom pathlib import Path\nlast_error='none'\n\
        for attempt in range(50):\n try:\n  connection=http.client.HTTPConnection('127.0.0.1',18089,timeout=.5)\n  connection.request('GET','/health')\n\
        \  response=connection.getresponse()\n  assert response.status==200\n  connection.close()\n  break\n except (OSError,http.client.HTTPException)\
        \ as error:\n  last_error=repr(error);time.sleep(.1)\nelse:\n print(Path('/tmp/moviemind-ui-fixture.log').read_text(errors='replace')[-4000:])\n\
        \ subprocess.run(['lsof','-nP','-iTCP:18089','-sTCP:LISTEN'])\n raise SystemExit('synthetic UI fixture did not start: '+last_error)\n\
        PYFIXTURE\ndevice=\"$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x[\"udid\"\
        ] for v in d[\"devices\"].values() for x in v if \"iPad\" in x[\"name\"]))')\"\nxcrun simctl boot \"$device\" || true\nxcrun simctl bootstatus\
        \ \"$device\" -b\nxcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -configuration Debug -destination \"platform=iOS Simulator,id=$device\"\
        \ -derivedDataPath build -resultBundlePath ui-results.xcresult -parallel-testing-enabled NO -only-testing:TogetherPoCUITests/MovieMindUITests\
        \ -only-testing:TogetherPoCUITests/WatchInterfaceTests/testFullscreenProgressAndRealMovieAdjustment CODE_SIGNING_ALLOWED=NO test 2>&1\
        \ | tee ui-tests.log\n"
    - name: Report actual test counts and compiler diagnostics
      if: always()
      run: "python3 - <<'PYCODE'\nfrom pathlib import Path\nimport json,subprocess\ndef notice(title,message):\n message=message.replace('%','%25').replace('\\\
        r','%0D').replace('\\n','%0A')\n print(f'::notice title={title}::{message}')\np=Path('ui-tests.log')\nlines=p.read_text(errors='replace').splitlines()\
        \ if p.exists() else []\nfor s in [x for x in lines if 'error:' in x or '** TEST ' in x][-20:]:notice('ui diagnostic',s[:5000])\nbundle=Path('ui-results.xcresult')\n\
        if bundle.exists():\n r=subprocess.run(['xcrun','xcresulttool','get','test-results','summary','--path',str(bundle)],capture_output=True,text=True)\n\
        \ if r.returncode==0:\n  d=json.loads(r.stdout)\n  counts={k:v for k,v in d.items() if 'test' in k.lower() and isinstance(v,(str,int))}\n\
        \  notice('ui actual summary',json.dumps(counts))\n  for fail in d.get('testFailures',[]):notice('ui failure',json.dumps(fail)[:6000])\n\
        \  assert d['totalTestCount']==3 and d['passedTests']==3 and d['failedTests']==0 and d['skippedTests']==0,d\n else:raise SystemExit('xcresult\
        \ summary unavailable')\nelse:raise SystemExit('UI result bundle missing')\nPYCODE\n"
    - name: Export only synthetic failure screenshots
      if: failure()
      continue-on-error: true
      run: 'test -d ui-results.xcresult && xcrun xcresulttool export attachments --path ui-results.xcresult --output-path ui-fixture-attachments
        --only-failures

        '
    - name: Keep synthetic native UI failure screenshots only
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: moviemind-087-synthetic-ui-failure
        path: ui-fixture-attachments/**/*.png
        if-no-files-found: ignore
        retention-days: 3
'on':
  workflow_dispatch:
    inputs:
      recipient:
        description: Public age recipient; private identity stays with the requester
        required: true
        type: string
