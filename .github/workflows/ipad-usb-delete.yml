name: MovieMind synthetic localhost fixture diagnostics
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: macos-15-intel
    timeout-minutes: 6
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Inspect only synthetic fixture startup and local sockets
      run: "set -uo pipefail\npython3 -u tools/moviemind_ui_fixture.py > /tmp/moviemind-fixture-debug.log\
        \ 2>&1 &\nfixture_pid=$!\ntrap 'kill \"$fixture_pid\" 2>/dev/null || true'\
        \ EXIT\nsleep 3\nps -p \"$fixture_pid\" -o pid,ppid,state,comm\nlsof -nP -iTCP:18089\
        \ -sTCP:LISTEN || true\ncat /tmp/moviemind-fixture-debug.log\npython3 - <<'PYFIXTURE'\n\
        import http.client,os,socket,sys,time,subprocess\nprint('Python',sys.executable,sys.version)\n\
        print('module diagnostics')\nimport threading,http.server,json\nprint(threading.__file__,http.server.__file__,json.__file__)\n\
        for address in ('127.0.0.1','localhost'):\n try:\n  c=http.client.HTTPConnection(address,18089,timeout=3);c.request('GET','/health');r=c.getresponse();print(address,r.status,r.read(100));c.close()\n\
        \ except Exception as e:print(address,type(e).__name__,repr(e))\nPYFIXTURE\n\
        cat /tmp/moviemind-fixture-debug.log\n"
