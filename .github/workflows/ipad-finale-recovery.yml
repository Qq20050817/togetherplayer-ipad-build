name: Verify iPad finale recovery after server restart
on:
  push:
    branches:
      - fix/ipad-finale-recovery-storyend-20261019
    paths:
      - 'ios/**'
      - '.github/workflows/ipad-finale-recovery.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ipad-finale-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ipad:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact branch revision
        run: |
          set -euo pipefail
          actual=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')
          test "$actual" = "$GITHUB_SHA"
      - name: Select Xcode 26
        run: |
          set -euo pipefail
          for v in 26.3 26.2 26.1.1 26.0.1; do
            d="/Applications/Xcode_${v}.app/Contents/Developer"
            if [ -d "$d" ]; then sudo xcode-select -s "$d"; break; fi
          done
          xcodebuild -version
      - name: Generate project and resolve dependencies
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
          python3 tools/resolve_apple_packages.py -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -derivedDataPath http-build
          python3 tools/patch_prism_swift61.py http-build/SourcePackages/checkouts/PrismCore
      - name: Build Release for iPad
        run: |
          set -euo pipefail
          xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -configuration Release -destination 'generic/platform=iOS' -derivedDataPath http-build CODE_SIGNING_ALLOWED=NO build
      - name: Run credits, reconnect, subtitle and question-bank regression tests
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > /tmp/together-ipad-http-devices.json
          DEVICE_ID=$(python3 -c 'import json; d=json.load(open("/tmp/together-ipad-http-devices.json"))["devices"]; print(next(x["udid"] for a in d.values() for x in a if "iPad" in x["name"]))')
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath http-build CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -only-testing:TogetherPoCCoreTests/FilmQuestionBankRuntimeTests -only-testing:TogetherPoCCoreTests/FilmBankGenreInstructionsTests -only-testing:TogetherPoCCoreTests/FilmSourceTitleTests -only-testing:TogetherPoCCoreTests/FilmBankV2Tests -only-testing:TogetherPoCCoreTests/FilmQuestionBankTests -only-testing:TogetherPoCCoreTests/FilmMaterialRemoteTests -only-testing:TogetherPoCCoreTests/PlaybackControlSafetyTests test
      - name: Package direct unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p http-delivery
          python3 tools/package_unsigned_ipa.py http-build/Build/Products/Release-iphoneos/TogetherPoC.app http-delivery/TogetherPlayer-iPad-v0.6.50-Build110-unsigned.ipa --notices ios/TogetherPoC.swiftpm/Licenses
          (cd http-delivery && shasum -a 256 TogetherPlayer-iPad-v0.6.50-Build110-unsigned.ipa > SHA256SUMS.txt)
          printf 'Source branch: %s\nSource SHA: %s\nTests: VM restart, safe delayed answer, local recap, storyline end timestamp, existing bank and playback regressions\nExcluded pre-existing failing RoomMovieSelectionTests (baseline run 39069382451)\nSigning: required before install\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" > http-delivery/BUILD.txt
      - name: Upload validated unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: TogetherPlayer-iPad-0.6.50-Finale-Recovery
          path: http-delivery/
          retention-days: 7
      - name: Publish direct IPA release after focused tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=ipad-v0.6.50-finale-recovery-20261019
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release exists; refusing to overwrite a published IPA"; exit 1
          fi
          gh release create "$tag" http-delivery/TogetherPlayer-iPad-v0.6.50-Build110-unsigned.ipa http-delivery/SHA256SUMS.txt http-delivery/BUILD.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "TogetherPlayer iPad 0.6.50: Finale Recovery and Credits Calibration" --prerelease \
            --notes "Local finale recap recovery after VM resets, user-calibrated story end and safe delayed guest answer reveal. Existing RoomMovieSelectionTests fail on the unmodified parent branch (run 39069382451) and were excluded from focused regression tests. IPA is unsigned and requires the user's signing procedure. Physical two-device playback is not yet certified."
