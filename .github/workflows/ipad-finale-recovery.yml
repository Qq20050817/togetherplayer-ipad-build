name: Verify iPad P2P 0.6.51 finale recovery
on:
  push:
    branches:
      - fix/ipad-finale-p2p-0651-20261019
    paths:
      - 'ios/**'
      - '.github/workflows/ipad-finale-recovery.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ipad-finale-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ipad:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact branch revision
        run: |
          set -euo pipefail
          actual=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')
          test "$actual" = "$GITHUB_SHA"
      - name: Select Xcode 26
        run: |
          set -euo pipefail
          for v in 26.3 26.2 26.1.1 26.0.1; do
            d="/Applications/Xcode_${v}.app/Contents/Developer"
            if [ -d "$d" ]; then sudo xcode-select -s "$d"; break; fi
          done
          xcodebuild -version
      - name: Generate project and resolve dependencies
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
          python3 tools/resolve_apple_packages.py -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -derivedDataPath http-build
          python3 tools/patch_prism_swift61.py http-build/SourcePackages/checkouts/PrismCore
      - name: Build Release for iPad
        run: |
          set -euo pipefail
          xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -configuration Release -destination 'generic/platform=iOS' -derivedDataPath http-build CODE_SIGNING_ALLOWED=NO build
      - name: Run credits, reconnect, subtitle and question-bank regression tests
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > /tmp/together-ipad-http-devices.json
          DEVICE_ID=$(python3 -c 'import json; d=json.load(open("/tmp/together-ipad-http-devices.json"))["devices"]; print(next(x["udid"] for a in d.values() for x in a if "iPad" in x["name"]))')
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath http-build CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -only-testing:TogetherPoCCoreTests/FilmQuestionBankRuntimeTests -only-testing:TogetherPoCCoreTests/FilmBankGenreInstructionsTests -only-testing:TogetherPoCCoreTests/FilmSourceTitleTests -only-testing:TogetherPoCCoreTests/FilmBankV2Tests -only-testing:TogetherPoCCoreTests/FilmQuestionBankTests -only-testing:TogetherPoCCoreTests/FilmMaterialRemoteTests -only-testing:TogetherPoCCoreTests/PlaybackControlSafetyTests -only-testing:TogetherPoCCoreTests/P2PFastPathGateTests test
      - name: Verify preserved P2P standalone transport decision gates
        run: |
          set -euo pipefail
          xcrun swiftc ios/TogetherPoC/P2PFastPathGate.swift ios/tests/P2PFastPathStandalone.swift -o /tmp/together-p2p-fastpath
          /tmp/together-p2p-fastpath
      - name: Package direct unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p http-delivery
          python3 tools/package_unsigned_ipa.py http-build/Build/Products/Release-iphoneos/TogetherPoC.app http-delivery/TogetherPlayer-iPad-v0.6.51-Build111-unsigned.ipa --notices ios/TogetherPoC.swiftpm/Licenses
          (cd http-delivery && shasum -a 256 TogetherPlayer-iPad-v0.6.51-Build111-unsigned.ipa > SHA256SUMS.txt)
          printf 'Source branch: %s\nSource SHA: %s\nTests: VM restart, safe delayed answer, calibrated credits end, story bank, playback recovery, P2P gate and standalone\nExcluded baseline RoomMovieSelectionTests failing before finale fix (build 39069382451)\nSigning: required before install; P2P preserved from validated release SHA b9dc76e12de4d07c758fb442239f6ef0da829289\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" > http-delivery/BUILD.txt
      - name: Upload validated unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: TogetherPlayer-iPad-0.6.51-Finale-Recovery
          path: http-delivery/
          retention-days: 7
      - name: Publish verified P2P-preserving 0.6.51 IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=ipad-v0.6.51-p2p-finale-recovery-20261019
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite"; exit 1
          fi
          gh release create "$tag" http-delivery/TogetherPlayer-iPad-v0.6.51-Build111-unsigned.ipa http-delivery/SHA256SUMS.txt http-delivery/BUILD.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "TogetherPlayer iPad 0.6.51: P2P + Finale Recovery" --prerelease \
            --notes "Retains iPad 0.6.50 P2P fastpath diagnostics and transports from verified source b9dc76e12de4d07c758fb442239f6ef0da829289. Fixes VM-restart finale recovery, per-film exact story ending and delayed guest answer reveal. New finale and P2P tests passed before publication. Existing RoomMovieSelectionTests fail even on original 0.6.49 source and are excluded from focused regressions. Unsigned IPA requires signing before installation. Physical dual-device testing remains pending."
