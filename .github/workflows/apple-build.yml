name: Publish verified story-turn iPad package
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require exact successful build and all regressions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view 38384750253 --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view 38384750253 --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = 67f4328fa5e19a330c7878178a6918b95df8f7d0
          gh run download 38384750253 --repo "$GITHUB_REPOSITORY" --name TogetherPlayer-iPad-v0.6.5-SoloPlot-Validated-candidate --dir verified
          cd verified
          sed 's|plot-delivery/||' SHA256SUMS.txt | sha256sum -c -
          cd ..
          cp verified/TogetherPlayer-0.6.5-SoloPlot-Validated-unsigned.ipa TogetherPlayer-iPad-0.6.5-SoloPlot-unsigned.ipa
      - name: Preserve exact public client source and licenses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/tarball/67f4328fa5e19a330c7878178a6918b95df8f7d0" > source.tar.gz
          mkdir source
          tar -xzf source.tar.gz --strip-components=1 -C source
          cd source
          zip -qr ../TogetherPlayer-0.6.5-SoloPlot-source.zip .
          cd ..
          sha256sum TogetherPlayer-iPad-0.6.5-SoloPlot-unsigned.ipa TogetherPlayer-0.6.5-SoloPlot-source.zip > SHA256SUMS.txt
      - name: Publish tested candidate only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.6.5-soloplot-preview-ipad TogetherPlayer-iPad-0.6.5-SoloPlot-unsigned.ipa TogetherPlayer-0.6.5-SoloPlot-source.zip SHA256SUMS.txt verified/BUILD.txt --repo "$GITHUB_REPOSITORY" --target 67f4328fa5e19a330c7878178a6918b95df8f7d0 --title 'TogetherPlayer iPad 0.6.5 · Solo plot questions' --notes 'Unsigned iPad IPA. Removes the two-member prerequisite for automatic plot questions. A single online host can receive and answer a question; a two-viewer question continues to wait for both answers through temporary disconnects. Original manual pause remains paused. Core tests and affected plot UI tests must pass before publication; earlier complete 22-case UI acceptance retained for unchanged features. Apple local AI and ChatGPT still require actual device/model/input acceptance; no genuine live-model or accuracy success claimed. Includes exact public source and licenses; sign using original certificate.' --prerelease
