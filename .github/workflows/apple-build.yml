name: Publish iPad plot polls and chat timestamps
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require native checks and download validated client
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh run view 38305465767 --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          gh run download 38305465767 --repo "$GITHUB_REPOSITORY" --name TogetherPlayer-unsigned-iPad --dir apple-delivery
          cp apple-delivery/TogetherPlayer-unsigned.ipa TogetherPlayer-iPad-0.6.2-unsigned.ipa
          cd apple-delivery/source
          zip -qr ../../TogetherPlayer-iPad-0.6.2-source.zip .
          cd ../..
          sha256sum TogetherPlayer-iPad-0.6.2-unsigned.ipa TogetherPlayer-iPad-0.6.2-source.zip > SHA256SUMS.txt
          gh release create v0.6.2-ipad TogetherPlayer-iPad-0.6.2-unsigned.ipa TogetherPlayer-iPad-0.6.2-source.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target 82e3a8fd86531579b44354bc063bc83dce9bf4dd --title 'TogetherPlayer iPad 0.6.2 · Plot polls and chat timestamps' --notes 'Plot questions use optional local Apple Foundation Models or free templates. Answers remain concealed until both current members submit. Chat retains original server timestamps. Both clients require 0.6.2 and the sync server has been updated. Completed embedded or external text captions only; physical Apple Intelligence has not been tested. Native regressions and live two-peer protocol checks passed. Unsigned IPA: sign with your existing certificate before installing. User original movie and physical iPad have not been tested directly.' --prerelease
