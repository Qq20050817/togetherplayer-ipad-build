name: Publish verified story-turn iPad package
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require exact successful build and all regressions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view 38363318379 --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view 38363318379 --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = 0222a736fa025df22ddbbecb348bc56f256043e8
          gh run download 38363318379 --repo "$GITHUB_REPOSITORY" --name TogetherPlayer-iPad-v0.6.3-StoryTurn-Validated-candidate --dir verified
          cd verified
          sed 's|plot-delivery/||' SHA256SUMS.txt | sha256sum -c -
          cd ..
          cp verified/TogetherPlayer-0.6.3-StoryTurn-Validated-unsigned.ipa TogetherPlayer-iPad-0.6.3-StoryTurn-unsigned.ipa
      - name: Preserve exact public client source and licenses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/tarball/0222a736fa025df22ddbbecb348bc56f256043e8" > source.tar.gz
          mkdir source
          tar -xzf source.tar.gz --strip-components=1 -C source
          cd source
          zip -qr ../TogetherPlayer-0.6.3-StoryTurn-source.zip .
          cd ..
          sha256sum TogetherPlayer-iPad-0.6.3-StoryTurn-unsigned.ipa TogetherPlayer-0.6.3-StoryTurn-source.zip > SHA256SUMS.txt
      - name: Publish tested candidate only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.6.3-storyturn-preview-ipad TogetherPlayer-iPad-0.6.3-StoryTurn-unsigned.ipa TogetherPlayer-0.6.3-StoryTurn-source.zip SHA256SUMS.txt verified/BUILD.txt --repo "$GITHUB_REPOSITORY" --target 0222a736fa025df22ddbbecb348bc56f256043e8 --title 'TogetherPlayer iPad 0.6.3 · Verified story-turn candidate' --notes 'Unsigned trial IPA. Fixes recursive published quota updates and final packaging. Full core and watch UI regression succeeded on the exact source; story-turn gate smoke and isolated authenticated server protocols passed. Local Apple AI availability and real official ChatGPT first authorization, continuous calls and restart remain device acceptance requirements. No actual model accuracy percentage is claimed. Production server remains 0.6.2; blocking question mode requires a separately authorized server update. Sign with the original certificate. Public source and licenses included; private server source retained in private repository.' --prerelease
