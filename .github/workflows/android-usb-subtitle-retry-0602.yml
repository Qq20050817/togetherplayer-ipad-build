name: Verify Android 0.6.60.2 USB ASS subtitle refresh
on:
  push:
    branches: [fix/android-usb-subtitle-retry-0602-20261023]
    paths: ['android/**', '.github/workflows/android-usb-subtitle-retry-0602.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-usb-subtitle-retry-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle verified offline voice model
        run: |
          curl -fL --retry 2 --max-time 180 https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip -o android/app/src/main/assets/voice-cn-model.zip
          echo '3af8b0e7e0f835ae9d414ce5df580237a3cfb08d586c9fbbb0f7ff29ad5b14ba  android/app/src/main/assets/voice-cn-model.zip' | sha256sum -c -
      - name: Unit tests and APK build
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd android && gradle --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.together.poc.WatchMemoryPersistenceTest
      - name: Publish verified APK without overwriting existing builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p delivery
          cp android/app/build/outputs/apk/debug/app-debug.apk delivery/TogetherPlayer-Android-0.6.60.2-USB-Subtitles.apk
          (cd delivery && sha256sum TogetherPlayer-Android-0.6.60.2-USB-Subtitles.apk > SHA256SUMS.txt)
          printf 'Source: %s\nBranch: %s\nCI: https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > delivery/BUILD.txt
          gh release create "android-usb-subtitles-0.6.60.2-${{ github.run_id }}" delivery/* --target "$GITHUB_SHA" --prerelease --title 'Android 0.6.60.2 USB subtitle discovery retry preview' --notes 'Based on verified Android 0.6.60.1. Auto-retries router USB ASS/SRT/VTT/SSA subtitle discovery on menu open and shows refreshed subtitle choices without reopening manually. Includes real Chinese-folder ASS manifest regression. Keeps Android local movie, watched history, and playback recovery. CI and emulator checks required; dual-device real media needs acceptance. Existing router and servers unchanged.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-usb-subtitle-retry-validation
          path: |
            delivery/
            android/app/build/reports/tests/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
