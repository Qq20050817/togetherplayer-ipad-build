name: Verify and build TogetherPlayer iPhone 0.6.65
on:
  push:
    branches: [feat/iphone-adaptive-064-20261023]
    paths: ['ios/**', '.github/workflows/iphone-adaptive-065.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: adaptive-iphone-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Generate iPhone + iPad native project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Resolve pinned video dependencies
        run: |
          python3 tools/resolve_apple_packages.py -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -derivedDataPath build
          python3 tools/patch_prism_swift61.py build/SourcePackages/checkouts/PrismCore
      - name: Build unsigned physical iPhone app
        run: |
          set -o pipefail
          xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee iphone-device-build.log
      - name: Test portrait, landscape and AI modals on iPhone simulator
        run: |
          set -o pipefail
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if "iPhone" in x["name"]))')"
          echo "Using iPhone simulator: $device"
          xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -configuration Debug -destination "platform=iOS Simulator,id=$device" -derivedDataPath build -resultBundlePath iphone-tests.xcresult -parallel-testing-enabled NO -only-testing:TogetherPoCUITests/IPhoneLayoutTests -only-testing:TogetherPoCCoreTests/VideoRotationTests -only-testing:TogetherPoCCoreTests/TMDBScraperTests CODE_SIGNING_ALLOWED=NO test 2>&1 | tee iphone-tests.log
      - name: Package and verify iPhone IPA
        run: |
          python3 tools/package_unsigned_ipa.py build/Build/Products/Release-iphoneos/TogetherPoC.app delivery/TogetherPlayer-iPhone-0.6.65-unsigned.ipa --notices ios/TogetherPoC.swiftpm/Licenses
          python3 - <<'PY'
          import plistlib,zipfile
          with zipfile.ZipFile('delivery/TogetherPlayer-iPhone-0.6.65-unsigned.ipa') as z:
            i=plistlib.loads(z.read('Payload/TogetherPoC.app/Info.plist'))
            assert i['CFBundleShortVersionString']=='0.6.65' and str(i['CFBundleVersion'])=='125'
            assert 1 in i.get('UIDeviceFamily', []), 'iPhone support missing'
            assert 'Payload/TogetherPoC.app/film-catalog.json' in z.namelist()
          PY
          shasum -a 256 delivery/*.ipa > delivery/SHA256SUMS.txt
          printf 'Source: %s\nCI: https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > delivery/BUILD.txt
      - name: Publish verified iPhone installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create iphone-0.6.65-${{ github.run_id }} delivery/* --target "$GITHUB_SHA" --prerelease --title 'TogetherPlayer iPhone 0.6.65 · 手机适配版' --notes 'iPhone adaptive layouts: compact room actions, full-width plot questions and recaps, landscape fullscreen, responsive movie catalog and subtitle/rotation controls. Keeps previous iPad capabilities. Unsigned IPA requires a user signing method before installation. Built for physical iOS and tested on iPhone simulator.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: togetherplayer-iphone-065-validation
          path: |
            delivery/
            iphone-*.log
            iphone-tests.xcresult
