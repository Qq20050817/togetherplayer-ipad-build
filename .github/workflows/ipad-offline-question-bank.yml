name: Verify AI film materials and offline question banks
on:
  push:
    branches: [feat/film-bank-v2-completion-20261016]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ipad-offline-bank-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ipad:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Ensure build uses the latest feature source
        run: |
          set -euo pipefail
          latest=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')
          test "$latest" = "$GITHUB_SHA" || { echo "Superseded build; refusing a stale package"; exit 1; }
      - name: Select available Xcode 26
        run: |
          set -euo pipefail
          for version in 26.3 26.2 26.1.1 26.0.1; do
            dev="/Applications/Xcode_${version}.app/Contents/Developer"
            if [ -d "$dev" ]; then sudo xcode-select -s "$dev"; xcodebuild -version; exit 0; fi
          done
          exit 1
      - name: Generate project and dependencies
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
          python3 tools/resolve_apple_packages.py -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -derivedDataPath plot-build
          python3 tools/patch_prism_swift61.py plot-build/SourcePackages/checkouts/PrismCore
      - name: Build device Release candidate
        run: |
          xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -configuration Release -destination 'generic/platform=iOS' -derivedDataPath plot-build CODE_SIGNING_ALLOWED=NO build
      - name: Boot iPad simulator
        run: |
          xcrun simctl list devices available -j > /tmp/plot-simulators.json
          DEVICE_ID=$(python3 -c 'import json; d=json.load(open("/tmp/plot-simulators.json"))["devices"]; print(next(x["udid"] for a in d.values() for x in a if "iPad" in x["name"]))')
          echo "SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Validate V2 exports and strict bank lifecycle without retries
        run: |
          xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath plot-build CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -only-testing:TogetherPoCCoreTests/FilmBankV2Tests -only-testing:TogetherPoCCoreTests/FilmQuestionBankRuntimeTests test
      - name: Test full native core including offline bank
        run: |
          xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath plot-build CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -only-testing:TogetherPoCCoreTests -retry-tests-on-failure test
      - name: Regression test double-sided playback and question UI
        run: |
          xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath plot-build CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -only-testing:TogetherPoCUITests/WatchInterfaceTests/testV2MaterialsAndJSONImportArePrimaryAndKeepFullscreen -only-testing:TogetherPoCUITests/WatchInterfaceTests/testBlockingPlotQuestionPresentsAutomaticallyInWatchPage -only-testing:TogetherPoCUITests/WatchInterfaceTests/testAISettingsRailPreservesMovieAndOffersSafeConnectionCheck -only-testing:TogetherPoCUITests/WatchInterfaceTests/testFullscreenQuestionRailDoesNotCoverTheMovie -only-testing:TogetherPoCUITests/WatchInterfaceTests/testLocalMKVPlaybackControlsSurviveInterleavedTransportActions -only-testing:TogetherPoCUITests/WatchInterfaceTests/testFullscreenProgressAndRealMovieAdjustment -only-testing:TogetherPoCUITests/WatchInterfaceTests/testFullscreenGestureSurfaceAndDeviceStatus -only-testing:TogetherPoCUITests/WatchInterfaceTests/testOpeningAIKeepsTheSamePlaybackCanvasInWatchAndFullscreen -only-testing:TogetherPoCUITests/WatchInterfaceTests/testAutomaticQuestionReplacesOpenSettingsInWatchAndFullscreen -retry-tests-on-failure test
      - name: Package unsigned IPA only after tests
        run: |
          set -euo pipefail
          mkdir -p plot-delivery
          python3 tools/package_unsigned_ipa.py plot-build/Build/Products/Release-iphoneos/TogetherPoC.app plot-delivery/TogetherPlayer-0.6.33-Film-Materials-Bank-unsigned.ipa --notices ios/TogetherPoC.swiftpm/Licenses
          cd plot-delivery
          shasum -a 256 TogetherPlayer-0.6.33-Film-Materials-Bank-unsigned.ipa > SHA256SUMS.txt
          printf 'Source branch: %s\nSource SHA: %s\nStatus: compiled and tested on iOS Simulator. Physical device and original MKV test remain required.\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" > BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TogetherPlayer-0.6.33-offline-bank
          path: plot-delivery/
          retention-days: 7
      - name: Export native test result summaries
        if: always()
        run: |
          mkdir -p test-reports
          for result in plot-build/Logs/Test/*.xcresult; do
            [ -d "$result" ] || continue
            xcrun xcresulttool get test-results summary --path "$result" > "test-reports/$(basename "$result").json" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: film-bank-v2-test-reports
          path: test-reports/
          retention-days: 7
  release:
    name: Publish unsigned IPA (no ZIP)
    if: ${{ success() }}
    needs: ipad
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate SHA256 and publish direct IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir verified
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name TogetherPlayer-0.6.33-offline-bank --dir verified
          grep -Fx "Source SHA: $GITHUB_SHA" verified/BUILD.txt
          (cd verified && sha256sum -c SHA256SUMS.txt)
          latest=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')
          test "$latest" = "$GITHUB_SHA" || { echo "Superseded release; refusing stale IPA"; exit 1; }
          tag='v0.6.33-ipad-film-materials-bank-20261016'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release exists; refusing to overwrite tested IPA';exit 1
          fi
          gh release create "$tag" verified/TogetherPlayer-0.6.33-Film-Materials-Bank-unsigned.ipa verified/SHA256SUMS.txt verified/BUILD.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "TogetherPlayer iPad 0.6.33 - Film materials + offline question banks" \
            --prerelease --notes "V2 preview: explicit, cancellable complete local subtitle and storyboard export, separate files and ZIP sharing, exact frame timeline and formal Schema/project guide; full-file SHA256 matching, persisted source-keyed banks and per-round progress, sentence-boundary triggering and delayed idempotent chat reveals. Reuses existing Android poll and chat protocols. Native/Simulator validation only; two physical devices and large original-film/HDR visual quality remain unverified. No production services changed. Unsigned IPA, sign with original certificate."
          git archive --format=zip --output=verified/TogetherPlayer-0.6.33-Film-Bank-V2-source.zip HEAD
          cp docs/question-bank-v1.schema.json verified/question-bank-v1.schema.json
          cp docs/CHATGPT_MOVIE_BANK_PROJECT.txt verified/ChatGPT-Movie-Bank-Project.txt
          cp docs/FILM_BANK_V2.md verified/Film-Bank-V2-Guide.md
          (cd verified && sha256sum TogetherPlayer-0.6.33-Film-Bank-V2-source.zip question-bank-v1.schema.json ChatGPT-Movie-Bank-Project.txt Film-Bank-V2-Guide.md > SOURCE-SHA256SUMS.txt)
          gh release upload "$tag" verified/TogetherPlayer-0.6.33-Film-Bank-V2-source.zip verified/question-bank-v1.schema.json verified/ChatGPT-Movie-Bank-Project.txt verified/Film-Bank-V2-Guide.md verified/SOURCE-SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"
