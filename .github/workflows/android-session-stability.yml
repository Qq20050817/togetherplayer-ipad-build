name: Android session stability regression
on:
  push:
    branches: [fix/android-session-stability-20261018]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-session-stability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests and APK compilation
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise real Activity room and connection lifecycle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd android && gradle --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.together.poc.RoomSessionStabilityTest
      - name: Package tested candidate
        run: |
          mkdir -p stability-delivery
          cp android/app/build/outputs/apk/debug/app-debug.apk stability-delivery/TogetherPlayer-Android-0.6.51-stability-candidate.apk
          printf 'Base: 830eee0e50b21e6196dc9b39946d745112075da9\nSource SHA: %s\nValidation: JVM tests and Android emulator session regression\nNot installed or field-tested. Debug signing.\n' "$GITHUB_SHA" > stability-delivery/BUILD.txt
          (cd stability-delivery && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-session-stability
          path: |
            stability-delivery/
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
          retention-days: 7
