name: iPad AV1 software playback verification
permissions:
  contents: read
concurrency:
  group: ipad-av1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
    - name: Select available Xcode 26
      run: |
        set -euo pipefail
        for version in 26.3 26.2 26.1.1 26.0.1; do
          dev="/Applications/Xcode_$version.app/Contents/Developer"
          if [ -d "$dev" ]; then sudo xcode-select -s "$dev"; xcodebuild -version; exit 0; fi
        done
        echo 'Required Xcode 26 image not installed' >&2
        exit 1
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Verify existing WebRTC ordering
      run: |
        node tools/test_p2p_channel_state.mjs
    - name: Generate Xcode project and prepare public-key encryption
      run: |
        brew install xcodegen age
        xcodegen generate --spec ios/project.yml
    - name: Resolve pinned PrismCore and MPVKit
      run: |
        python3 tools/resolve_apple_packages.py -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -derivedDataPath build
        python3 tools/patch_prism_swift61.py build/SourcePackages/checkouts/PrismCore
    - name: Build physical iPad Release application
      run: |
        set -o pipefail
        xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee moviemind-device-package.log
    - name: Package and verify unsigned device IPA
      run: |
        set -euo pipefail
        python3 tools/package_unsigned_ipa.py build/Build/Products/Release-iphoneos/TogetherPoC.app delivery/TogetherPlayer-iPad-0.6.88-AV1-unsigned.ipa --notices ios/TogetherPoC.swiftpm/Licenses
        python3 - <<'PYCODE'
        from pathlib import Path
        import hashlib,json,os,plistlib,struct,zipfile
        p=Path('delivery/TogetherPlayer-iPad-0.6.88-AV1-unsigned.ipa')
        with zipfile.ZipFile(p) as z:
            assert z.testzip() is None
            root='Payload/TogetherPoC.app/'
            info=plistlib.loads(z.read(root+'Info.plist'))
            assert info['CFBundleShortVersionString']=='0.6.88'
            assert str(info['CFBundleVersion'])=='148'
            assert info['CFBundleIdentifier']=='dev.together.poc.asrtest'
            assert info['CFBundleSupportedPlatforms']==['iPhoneOS']
            assert 2 in info['UIDeviceFamily']
            data=z.read(root+info['CFBundleExecutable'])
            header=struct.unpack_from('<8I',data)
            assert header[0]==0xfeedfacf and header[1]==0x0100000c and header[3]==2
            offset=32;platforms=[]
            for _ in range(header[4]):
                cmd,size=struct.unpack_from('<II',data,offset)
                assert size>=8 and offset+size<=len(data)
                if cmd==0x32:platforms.append(struct.unpack_from('<I',data,offset+8)[0])
                offset+=size
            assert platforms==[2],platforms
            assert any(n.startswith(root+'ThirdPartyNotices/') for n in z.namelist())
        result={'file':p.name,'version':'0.6.88','build':148,'bundleId':info['CFBundleIdentifier'],'platform':'iOS device','architecture':'arm64','minimumOS':info['MinimumOSVersion'],'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'sourceCommit':os.environ['GITHUB_SHA'],'sourceRef':os.environ['GITHUB_REF_NAME'],'buildUrl':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",'unsigned':True,'signingRequiredBeforeInstallation':True, 'iosSourceTree':__import__('subprocess').check_output(['git','rev-parse','HEAD:ios'],text=True).strip(),'validationRun':os.environ['GITHUB_RUN_ID'],'validationRequiresAllJobsSuccess':True,'physicalDeviceAcceptance':False,'publicPlaintextInstallerUploaded':False,'transportEncryption':'age X25519'}
        Path('sealed').mkdir(exist_ok=True)
        Path('sealed/ipad-package.json').write_text(json.dumps(result,indent=2)+'\n')
        print('::notice title=Verified iPad IPA::0.6.88/148; iOS-device ARM64; unsigned; '+result['sha256'])
        PYCODE
    - name: Encrypt candidate for the requester before uploading
      env:
        MOVIEMIND_RECIPIENT: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFJLdPCKpoliJ7zcag4E3oZax0fYfY1ygQYXJDXlaOE+
      run: |
        set -euo pipefail
        age -r "$MOVIEMIND_RECIPIENT" -o sealed/TogetherPlayer-iPad-0.6.88-AV1-unsigned.ipa.age delivery/TogetherPlayer-iPad-0.6.88-AV1-unsigned.ipa
        test -s sealed/TogetherPlayer-iPad-0.6.88-AV1-unsigned.ipa.age
    - name: Preserve only encrypted candidate and non-secret provenance
      uses: actions/upload-artifact@v4
      with:
        name: ipad-av1-088-encrypted-${{ github.run_attempt }}
        path: |
          sealed/*.age
          sealed/ipad-package.json
        if-no-files-found: error
        retention-days: 7
    - name: Remove transient plaintext IPA
      if: always()
      run: |
        python3 - <<'PYCODE'
        from pathlib import Path
        Path('delivery/TogetherPlayer-iPad-0.6.88-AV1-unsigned.ipa').unlink(missing_ok=True)
        PYCODE
    - name: Report compiler diagnostics
      if: always()
      run: |
        python3 - <<'PYCODE'
        from pathlib import Path
        p=Path('moviemind-device-package.log')
        lines=p.read_text(errors='replace').splitlines() if p.exists() else []
        for line in [s for s in lines if 'error:' in s or '** BUILD ' in s][-15:]:
            line=line[:5000].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
            print('::notice title=Device package diagnostic::'+line)
        PYCODE
  native:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
    - name: Select available Xcode 26
      run: |
        set -euo pipefail
        for version in 26.3 26.2 26.1.1 26.0.1; do
          dev="/Applications/Xcode_$version.app/Contents/Developer"
          if [ -d "$dev" ]; then sudo xcode-select -s "$dev"; xcodebuild -version; exit 0; fi
        done
        echo 'Required Xcode 26 image not installed' >&2
        exit 1
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Verify existing WebRTC ordering
      run: |
        node tools/test_p2p_channel_state.mjs
    - name: Generate Xcode project
      run: |
        brew install xcodegen
        xcodegen generate --spec ios/project.yml
    - name: Resolve pinned PrismCore and MPVKit
      run: |
        python3 tools/resolve_apple_packages.py -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -derivedDataPath build
        python3 tools/patch_prism_swift61.py build/SourcePackages/checkouts/PrismCore
    - name: Run new login fixtures and preserved native regressions
      run: |
        set -o pipefail
        device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if "iPad" in x["name"]))')"
        xcrun simctl boot "$device" || true
        xcrun simctl bootstatus "$device" -b
        xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -configuration Debug -destination "platform=iOS Simulator,id=$device" -derivedDataPath build -resultBundlePath native-results.xcresult -parallel-testing-enabled NO -only-testing:TogetherPoCCoreTests/AV1SoftwarePlaybackTests -only-testing:TogetherPoCCoreTests/MovieMindCoverageTests -only-testing:TogetherPoCCoreTests/RouterUSBManagementTests -only-testing:TogetherPoCCoreTests/USBPlaylistCatalogTests -only-testing:TogetherPoCCoreTests/RoomConnectionTests -only-testing:TogetherPoCCoreTests/PlaybackSeekSliderTests -only-testing:TogetherPoCCoreTests/PlaybackClockTests -only-testing:TogetherPoCCoreTests/ThreeSecondSyncTests -only-testing:TogetherPoCCoreTests/SeekBurstTests -only-testing:TogetherPoCCoreTests/FullscreenSpeedTests -only-testing:TogetherPoCCoreTests/PlaybackControlSafetyTests -only-testing:TogetherPoCCoreTests/ScrollRefreshTests -only-testing:TogetherPoCCoreTests/P2PFastPathGateTests -only-testing:TogetherPoCCoreTests/FilmAudioCaptureTests -only-testing:TogetherPoCCoreTests/SubtitleVerificationPlanTests -only-testing:TogetherPoCCoreTests/AudioSubtitleTests -only-testing:TogetherPoCCoreTests/RouterUSBSubtitleCatalogTests -only-testing:TogetherPoCCoreTests/MovieMindLoginTests -only-testing:TogetherPoCCoreTests/MovieMindJournalTests CODE_SIGNING_ALLOWED=NO test 2>&1 | tee native-tests.log
    - name: Report actual test counts and compiler diagnostics
      if: always()
      run: |
        python3 - <<'PYCODE'
        from pathlib import Path
        import json,subprocess
        def notice(title,message):
         message=message.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
         print(f'::notice title={title}::{message}')
        p=Path('native-tests.log')
        lines=p.read_text(errors='replace').splitlines() if p.exists() else []
        for s in [x for x in lines if 'error:' in x or '** TEST ' in x][-20:]:notice('native diagnostic',s[:5000])
        bundle=Path('native-results.xcresult')
        if bundle.exists():
         r=subprocess.run(['xcrun','xcresulttool','get','test-results','summary','--path',str(bundle)],capture_output=True,text=True)
         if r.returncode==0:
          d=json.loads(r.stdout)
          counts={k:v for k,v in d.items() if 'test' in k.lower() and isinstance(v,(str,int))}
          notice('native actual summary',json.dumps(counts))
          for fail in d.get('testFailures',[]):notice('native failure',json.dumps(fail)[:6000])
         else:notice('native result parser',r.stderr[:1000])
        PYCODE
  ui:
    runs-on: macos-15-intel
    timeout-minutes: 55
    steps:
    - name: Select available Xcode 26
      run: |
        set -euo pipefail
        for version in 26.3 26.2 26.1.1 26.0.1; do
          dev="/Applications/Xcode_$version.app/Contents/Developer"
          if [ -d "$dev" ]; then sudo xcode-select -s "$dev"; xcodebuild -version; exit 0; fi
        done
        echo 'Required Xcode 26 image not installed' >&2
        exit 1
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Verify existing WebRTC ordering
      run: |
        node tools/test_p2p_channel_state.mjs
    - name: Generate Xcode project
      run: |
        brew install xcodegen
        xcodegen generate --spec ios/project.yml
    - name: Resolve pinned PrismCore and MPVKit
      run: |
        python3 tools/resolve_apple_packages.py -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -derivedDataPath build
        python3 tools/patch_prism_swift61.py build/SourcePackages/checkouts/PrismCore
    - name: Run native record review edit recommendation and existing fullscreen UI workflows
      run: |
        set -o pipefail
        python3 tools/moviemind_ui_fixture.py > /tmp/moviemind-ui-fixture.log 2>&1 &
        fixture_pid=$!
        trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
        python3 - <<'PYFIXTURE'
        import http.client,time,subprocess
        from pathlib import Path
        last_error='none'
        for attempt in range(50):
         try:
          connection=http.client.HTTPConnection('127.0.0.1',18089,timeout=.5)
          connection.request('GET','/health')
          response=connection.getresponse()
          assert response.status==200
          connection.close()
          break
         except (OSError,http.client.HTTPException) as error:
          last_error=repr(error);time.sleep(.1)
        else:
         print(Path('/tmp/moviemind-ui-fixture.log').read_text(errors='replace')[-4000:])
         subprocess.run(['lsof','-nP','-iTCP:18089','-sTCP:LISTEN'])
         raise SystemExit('synthetic UI fixture did not start: '+last_error)
        PYFIXTURE
        device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if "iPad" in x["name"]))')"
        xcrun simctl boot "$device" || true
        xcrun simctl bootstatus "$device" -b
        xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -configuration Debug -destination "platform=iOS Simulator,id=$device" -derivedDataPath build -resultBundlePath ui-results.xcresult -parallel-testing-enabled NO -only-testing:TogetherPoCUITests/MovieMindUITests -only-testing:TogetherPoCUITests/WatchInterfaceTests/testFullscreenProgressAndRealMovieAdjustment CODE_SIGNING_ALLOWED=NO test 2>&1 | tee ui-tests.log
    - name: Report actual test counts and compiler diagnostics
      if: always()
      run: |
        python3 - <<'PYCODE'
        from pathlib import Path
        import json,subprocess
        def notice(title,message):
         message=message.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
         print(f'::notice title={title}::{message}')
        p=Path('ui-tests.log')
        lines=p.read_text(errors='replace').splitlines() if p.exists() else []
        for s in [x for x in lines if 'error:' in x or '** TEST ' in x][-20:]:notice('ui diagnostic',s[:5000])
        bundle=Path('ui-results.xcresult')
        if bundle.exists():
         r=subprocess.run(['xcrun','xcresulttool','get','test-results','summary','--path',str(bundle)],capture_output=True,text=True)
         if r.returncode==0:
          d=json.loads(r.stdout)
          counts={k:v for k,v in d.items() if 'test' in k.lower() and isinstance(v,(str,int))}
          notice('ui actual summary',json.dumps(counts))
          for fail in d.get('testFailures',[]):notice('ui failure',json.dumps(fail)[:6000])
          assert d['totalTestCount']==3 and d['passedTests']==3 and d['failedTests']==0 and d['skippedTests']==0,d
         else:raise SystemExit('xcresult summary unavailable')
        else:raise SystemExit('UI result bundle missing')
        PYCODE
    - name: Export synthetic UI attachments for image-only diagnostics
      if: failure()
      continue-on-error: true
      run: |
        test -d ui-results.xcresult && xcrun xcresulttool export attachments --path ui-results.xcresult --output-path ui-fixture-attachments
    - name: Keep only synthetic native UI screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: moviemind-087-synthetic-ui-failure
        path: |-
          ui-fixture-attachments/**/*.png
          ui-fixture-attachments/**/*.jpg
          ui-fixture-attachments/**/*.jpeg
        if-no-files-found: ignore
        retention-days: 3
'on':
  push:
    branches:
    - fix/ipad-av1-software-20261119
    paths:
    - ios/**
    - tools/patch_prism_swift61.py
    - .github/workflows/ipad-av1.yml
