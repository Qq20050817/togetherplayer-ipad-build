name: Verify and build iPad watch memory 0.6.60
on:
  push:
    branches: [feat/ipad-watch-memory-recommendations-20261022]
    paths: ['ios/**', '.github/workflows/watch-memory-ipad.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: watch-memory-ipad-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Generate native project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Resolve pinned dependencies
        run: |
          python3 tools/resolve_apple_packages.py -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -derivedDataPath build
          python3 tools/patch_prism_swift61.py build/SourcePackages/checkouts/PrismCore
      - name: Verify persistence recommendations and watch coverage
        run: |
          set -o pipefail
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if "iPad" in x["name"]))')"
          xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -configuration Debug -destination "platform=iOS Simulator,id=$device" -derivedDataPath build -resultBundlePath memory-tests.xcresult -parallel-testing-enabled NO -only-testing:TogetherPoCCoreTests/WatchMemoryTests -only-testing:TogetherPoCUITests/WatchMemoryUITests CODE_SIGNING_ALLOWED=NO test 2>&1 | tee memory-tests.log
          xcrun simctl io "$device" screenshot watch-memory.png || true
      - name: Build physical iPad
        run: |
          set -o pipefail
          xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee memory-device-build.log
      - name: Package and verify IPA
        run: |
          python3 tools/package_unsigned_ipa.py build/Build/Products/Release-iphoneos/TogetherPoC.app delivery/TogetherPlayer-iPad-0.6.60-unsigned.ipa --notices ios/TogetherPoC.swiftpm/Licenses
          python3 - <<'PY'
          import plistlib,zipfile
          with zipfile.ZipFile('delivery/TogetherPlayer-iPad-0.6.60-unsigned.ipa') as z:
            i=plistlib.loads(z.read('Payload/TogetherPoC.app/Info.plist'))
            assert i['CFBundleShortVersionString']=='0.6.60' and str(i['CFBundleVersion'])=='120'
            assert 'Payload/TogetherPoC.app/film-catalog.json' in z.namelist()
          PY
          shasum -a 256 delivery/*.ipa > delivery/SHA256SUMS.txt
          printf 'Source: %s\nCI: https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > delivery/BUILD.txt
      - name: Publish verified installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create watch-memory-ipad-0.6.60-${{ github.run_id }} delivery/* --target "$GITHUB_SHA" --prerelease --title 'iPad 0.6.60 watch memory preview' --notes 'Persistent watch history, genre-based recommendations and feedback. Unit and simulator UI checks passed; physical iPad playback remains to be checked. Unsigned IPA requires signing.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watch-memory-ipad-validation
          path: |
            delivery/
            memory-*.log
            memory-tests.xcresult
            watch-memory.png
