name: Android 0.6.60.17 isolated HDR field diagnostic (unverified)
on:
  push:
    branches: [fix/android-hevc-hdr10-surface-trial-0617-20261106]
    paths: ['.github/workflows/android-hdr17-field-diagnostic.yml']
permissions:
  contents: read
concurrency:
  group: android-hdr17-field-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-isolated-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ORG_GRADLE_PROJECT_deliveryCompressedNative: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Verify trial app source is unchanged
        run: |
          git diff --exit-code 94c371aa8f0fb145c71013b385fac555f925b261 HEAD -- android/app/src/main/java android/app/src/main/res
          grep -F 'applicationIdSuffix = ".hdrtrial17"' android/app/build.gradle.kts
          grep -F 'versionName = "0.6.60.17"' android/app/build.gradle.kts
      - name: Bundle verified offline voice model
        run: |
          mkdir -p android/app/src/main/assets
          curl -fL --retry 2 --max-time 180 https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip -o android/app/src/main/assets/voice-cn-model.zip
          echo '3af8b0e7e0f835ae9d414ce5df580237a3cfb08d586c9fbbb0f7ff29ad5b14ba  android/app/src/main/assets/voice-cn-model.zip' | sha256sum -c -
      - name: Test and assemble isolated ARM64 preview
        working-directory: android
        run: gradle --no-daemon -PdeliveryArm64=true testDebugUnitTest assembleDebug
      - name: Verify isolated APK identity and native contents
        run: |
          mkdir -p delivery
          cp android/app/build/outputs/apk/debug/app-debug.apk delivery/TogetherPlayer-Android-0.6.60.17-HDR-Field-Diagnostic.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)"
          "$aapt" dump badging delivery/*.apk > delivery/package-identity.txt
          python3 - <<'PY'
          import zipfile,pathlib,hashlib
          p=pathlib.Path('delivery/TogetherPlayer-Android-0.6.60.17-HDR-Field-Diagnostic.apk')
          assert p.stat().st_size < 100*1024*1024
          with zipfile.ZipFile(p) as z:
              libs=[x for x in z.infolist() if x.filename.startswith('lib/')]
              assert libs and all(x.filename.startswith('lib/arm64-v8a/') and x.compress_type==8 for x in libs)
              assert hashlib.sha256(z.read('assets/voice-cn-model.zip')).hexdigest()=='3af8b0e7e0f835ae9d414ce5df580237a3cfb08d586c9fbbb0f7ff29ad5b14ba'
          identity=pathlib.Path('delivery/package-identity.txt').read_text()
          assert "name='dev.together.poc.hdrtrial17'" in identity
          assert "versionName='0.6.60.17'" in identity
          PY
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke-test independent package install and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            python3 android/emulator-preflight.py
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm list packages | grep -x 'package:dev.together.poc.hdrtrial17'
            adb shell am start -W -n dev.together.poc.hdrtrial17/dev.together.poc.MainActivity
            sleep 3
            adb shell pidof dev.together.poc.hdrtrial17
      - name: Record exact diagnostic bytes
        run: |
          (cd delivery && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-hdr17-field-diagnostic-unverified
          path: |
            delivery/
            android/app/build/reports/tests/
          retention-days: 7
