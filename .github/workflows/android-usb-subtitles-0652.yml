name: Android 0.6.52 USB subtitle discovery
on:
  push:
    branches:
      - feat/android-usb-subtitles-20261019
    paths:
      - 'android/app/src/main/java/dev/together/poc/MainActivity.kt'
      - 'android/app/src/main/java/dev/together/poc/UsbSubtitleCatalog.kt'
      - 'android/app/src/test/java/dev/together/poc/UsbSubtitleCatalogTest.kt'
      - 'android/app/build.gradle.kts'
      - '.github/workflows/android-usb-subtitles-0652.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-usb-subtitles-0652-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and run unit tests
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Prepare checksummed APK
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p delivery
          cp android/app/build/outputs/apk/debug/app-debug.apk delivery/TogetherPlayer-Android-0.6.52-USB-Subtitles.apk
          (cd delivery && sha256sum TogetherPlayer-Android-0.6.52-USB-Subtitles.apk > SHA256SUMS.txt)
          printf 'Version: Android 0.6.52\nSource SHA: %s\nFeature: signed USB movie subtitle auto-discovery and menu selection\nTested: Gradle unit and debug APK assembly. Router /media catalog endpoint required. Two-device playback still requires field acceptance.\n' "$GITHUB_SHA" > delivery/BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Android-0.6.52-USB-Subtitles
          path: delivery/
          retention-days: 7
      - name: Publish verified direct APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v0.6.52-usb-subtitles-stability-android-preview
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release tag exists; refusing overwrite" >&2
            exit 1
          fi
          gh release create "$tag" \
            delivery/TogetherPlayer-Android-0.6.52-USB-Subtitles.apk \
            delivery/SHA256SUMS.txt delivery/BUILD.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "TogetherPlayer Android 0.6.52 · U盘字幕与会话稳定性" \
            --notes "Direct APK, no ZIP. Reads a signed subtitle manifest from the existing router USB movie URL, shows matching SRT/VTT/ASS/SSA files in the Android subtitle menu and downloads the selected subtitle on demand. Original movie streaming, Muse, P2P, and other services are untouched. Router media endpoint must support subtitles=1, valid signed links, and same-film sidecar filtering. Debug signing may differ from current installation, so do not uninstall the working app solely for testing."
