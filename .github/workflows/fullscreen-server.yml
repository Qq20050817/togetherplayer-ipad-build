name: Verify fullscreen speed sync server
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: server/go.sum
      - name: Verify sync controls and leases
        working-directory: server
        run: go test -race ./...
      - name: Build Muse binary
        working-directory: server
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o together-server ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: TogetherPlayer-fullscreen-server
          path: server/together-server
          retention-days: 7
