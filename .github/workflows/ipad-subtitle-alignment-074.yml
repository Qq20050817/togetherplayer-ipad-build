name: iPad subtitle comparison 0.6.74
on:
  push:
    branches: [fix/ipad-subtitle-alignment-074-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - name: Select available Xcode 26
        run: |
          set -euo pipefail
          for version in 26.3 26.2 26.1.1 26.0.1; do
            dev="/Applications/Xcode_${version}.app/Contents/Developer"
            if [ -d "$dev" ]; then sudo xcode-select -s "$dev"; xcodebuild -version; exit 0; fi
          done
          echo 'Required Xcode 26 image not installed' >&2
          exit 1
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Resolve pinned PrismCore and MPVKit
        run: |
          python3 tools/resolve_apple_packages.py -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -derivedDataPath build
          python3 tools/patch_prism_swift61.py build/SourcePackages/checkouts/PrismCore
      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee subtitle-device-build.log
      - name: Run targeted native regression tests
        run: |
          set -o pipefail
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if "iPad" in x["name"]))')"
          xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -configuration Debug -destination "platform=iOS Simulator,id=$device" -derivedDataPath build -resultBundlePath subtitle-verify-tests.xcresult -parallel-testing-enabled NO -only-testing:TogetherPoCCoreTests/FilmAudioCaptureTests -only-testing:TogetherPoCCoreTests/SubtitleVerificationPlanTests -only-testing:TogetherPoCCoreTests/AudioSubtitleTests -only-testing:TogetherPoCCoreTests/RouterUSBSubtitleCatalogTests CODE_SIGNING_ALLOWED=NO test 2>&1 | tee subtitle-verify-tests.log
      - name: Package candidate unsigned IPA
        run: |
          python3 tools/package_unsigned_ipa.py build/Build/Products/Release-iphoneos/TogetherPoC.app delivery/TogetherPlayer-iPad-0.6.74-Subtitle-Comparison-unsigned.ipa --notices ios/TogetherPoC.swiftpm/Licenses
          python3 - <<'PY'
          import plistlib,zipfile
          with zipfile.ZipFile('delivery/TogetherPlayer-iPad-0.6.74-Subtitle-Comparison-unsigned.ipa') as z:
              p=plistlib.loads(z.read('Payload/TogetherPoC.app/Info.plist'))
              assert p['CFBundleShortVersionString']=='0.6.74'
              assert str(p['CFBundleVersion'])=='134'
              assert p['CFBundleIdentifier']=='dev.together.poc.asrtest'
          PY
          shasum -a 256 delivery/*.ipa > delivery/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipad-subtitle-comparison-074-unsigned
          path: |
            delivery/
            subtitle-*.log
            subtitle-verify-tests.xcresult

  release:
    name: Publish tested IPA as a direct download
    needs: verify
    if: ${{ success() && false }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download CI artifact and check SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verified
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name ipad-subtitle-comparison-074-unsigned --dir verified
          cd verified
          sha256sum -c delivery/SHA256SUMS.txt
      - name: Publish isolated prerelease with direct IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v0.6.74-ipad-subtitle-comparison-20261028'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Preview release exists, refusing to overwrite it.' >&2
            exit 1
          fi
          gh release create "$tag" verified/delivery/TogetherPlayer-iPad-0.6.74-Subtitle-Comparison-unsigned.ipa verified/delivery/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'TogetherPlayer iPad 0.6.74 字幕比对' --notes 'Selected subtitle cues are now sent for comparison; handles speech retries and distinguishes insufficient evidence from misalignment. Server recognition and full-film matching remain evidence dependent. No automatic subtitle edits. Same isolated app namespace. Unsigned IPA requires signing; physical iPad acceptance is pending.'
