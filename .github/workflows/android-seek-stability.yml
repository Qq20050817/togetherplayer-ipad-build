name: Verify Android responsive controls
on:
  push:
    branches: [fix/android-seek-controls-stability-20261014]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-seek-stability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use Android SDK preinstalled on GitHub Runner
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || command -v sdkmanager
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run Android unit tests and build APK
        run: |
          set -euo pipefail
          gradle -p android --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Stage exact-source QA candidate
        run: |
          set -euo pipefail
          mkdir -p android-seek-qa
          cp android/app/build/outputs/apk/debug/app-debug.apk android-seek-qa/TogetherPlayer-Android-0.6.4-SeekStability-DEBUG.apk
          sha256sum android-seek-qa/*.apk > android-seek-qa/SHA256SUMS.txt
          printf 'Source branch: %s\nSource SHA: %s\nStatus: debug-signed test candidate only. DO NOT install over the existing original-signer APK or uninstall the current app. Original signer is required for an upgrade-preserving delivery. Real-device crash and network-latency acceptance pending.\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" > android-seek-qa/BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TogetherPlayer-Android-v0.6.4-SeekStability-DEBUG-QA
          path: android-seek-qa/
          retention-days: 7
