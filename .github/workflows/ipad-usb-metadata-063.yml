name: Verify and build iPad localized movie posters 0.6.63
on:
  push:
    branches: [fix/ipad-usb-chinese-posters-20261022]
    paths: ['ios/**', '.github/workflows/ipad-usb-metadata-063.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: usb-metadata-ipad-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Generate native project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Resolve pinned dependencies
        run: |
          python3 tools/resolve_apple_packages.py -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -derivedDataPath build
          python3 tools/patch_prism_swift61.py build/SourcePackages/checkouts/PrismCore
      - name: Build physical iPad
        run: |
          set -o pipefail
          xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee metadata-device-build.log
      - name: Verify Chinese titles, poster identity, watch coverage and rotation
        run: |
          set -o pipefail
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if "iPad" in x["name"]))')"
          xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -configuration Debug -destination "platform=iOS Simulator,id=$device" -derivedDataPath build -resultBundlePath metadata-tests.xcresult -parallel-testing-enabled NO -only-testing:TogetherPoCCoreTests/USBPlaylistCatalogTests -only-testing:TogetherPoCCoreTests/WatchAIRecommendationTests -only-testing:TogetherPoCCoreTests/ChatGPTRequestSupportTests -only-testing:TogetherPoCCoreTests/WatchMemoryTests -only-testing:TogetherPoCCoreTests/VideoRotationTests -only-testing:TogetherPoCUITests/WatchAIRecommendationUITests -only-testing:TogetherPoCUITests/WatchMemoryUITests -only-testing:TogetherPoCUITests/VideoRotationUITests CODE_SIGNING_ALLOWED=NO test 2>&1 | tee metadata-tests.log

      - name: Package and verify IPA
        run: |
          python3 tools/package_unsigned_ipa.py build/Build/Products/Release-iphoneos/TogetherPoC.app delivery/TogetherPlayer-iPad-0.6.63-unsigned.ipa --notices ios/TogetherPoC.swiftpm/Licenses
          python3 - <<'PY'
          import plistlib,zipfile
          with zipfile.ZipFile('delivery/TogetherPlayer-iPad-0.6.63-unsigned.ipa') as z:
            i=plistlib.loads(z.read('Payload/TogetherPoC.app/Info.plist'))
            assert i['CFBundleShortVersionString']=='0.6.63' and str(i['CFBundleVersion'])=='123'
            assert 'Payload/TogetherPoC.app/film-catalog.json' in z.namelist()
          PY
          shasum -a 256 delivery/*.ipa > delivery/SHA256SUMS.txt
          printf 'Source: %s\nCI: https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > delivery/BUILD.txt
      - name: Publish verified installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create usb-metadata-ipad-0.6.63-${{ github.run_id }} delivery/* --target "$GITHUB_SHA" --prerelease --title 'TogetherPlayer iPad 0.6.63 · 中文片名与海报修复预览' --notes 'USB film titles use shipped Chinese film identities and regional Apple artwork lookup with release-year checks. Native build and selected simulator checks must pass before this unsigned IPA is published. Apple storefronts may lack artwork for some movies. Physical-device playback and poster availability still require acceptance.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usb-metadata-ipad-validation
          path: |
            delivery/
            metadata-*.log
            metadata-tests.xcresult
            watch-memory.png
