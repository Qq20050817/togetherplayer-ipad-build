name: Android local-first and USB resilience 0.6.60.10
on:
  push:
    branches: [fix/android-smart-pause-20261104]
    paths: ['android/**', '.github/workflows/android-local-first-usb.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-range-2008-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        timeout-minutes: 5
        with:
          cache-disabled: true
          gradle-version: '8.9'
      - name: Bundle verified offline voice model
        run: |
          mkdir -p android/app/src/main/assets
          curl -fL --retry 2 --max-time 180 https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip -o android/app/src/main/assets/voice-cn-model.zip
          echo '3af8b0e7e0f835ae9d414ce5df580237a3cfb08d586c9fbbb0f7ff29ad5b14ba  android/app/src/main/assets/voice-cn-model.zip' | sha256sum -c -
      - name: Unit tests and APK build
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify playback UI on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash android/decoder-check.sh false
      - name: Preserve candidate APK
        run: |
          mkdir -p delivery
          cp android/app/build/outputs/apk/debug/app-debug.apk delivery/TogetherPlayer-Android-0.6.60.10-Local-First-USB.apk
          (cd delivery && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-sustained-catchup-0610
          path: |
            delivery/
            android/app/build/reports/tests/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          retention-days: 7
