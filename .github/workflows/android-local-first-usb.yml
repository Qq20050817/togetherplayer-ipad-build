name: Xiaomi Pad7 compressed ARM64 APK 0.6.60.14
on:
  push:
    branches: [fix/android-http-main10-late-frames-0614-20261105]
    paths: ['android/**', '.github/workflows/android-local-first-usb.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-range-2008-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-deliver:
    env:
      ORG_GRADLE_PROJECT_deliveryCompressedNative: "true"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        timeout-minutes: 5
        with:
          cache-disabled: true
          gradle-version: '8.9'
      - name: Bundle verified offline voice model
        run: |
          mkdir -p android/app/src/main/assets
          curl -fL --retry 2 --max-time 180 https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip -o android/app/src/main/assets/voice-cn-model.zip
          echo '3af8b0e7e0f835ae9d414ce5df580237a3cfb08d586c9fbbb0f7ff29ad5b14ba  android/app/src/main/assets/voice-cn-model.zip' | sha256sum -c -
      - name: Unit tests and APK build
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify playback UI on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            python3 android/emulator-preflight.py
            result=0; gradle -p android --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.together.poc.CompatiblePlaybackTest#main10MovieRateHttpKeepsColorsAudioAndPositionDuringCatchup,dev.together.poc.CompatibleHttpRecoveryTest || result=$?; mkdir -p android-delivery/screenshots; adb pull /sdcard/Pictures/TogetherUITests/ android-delivery/screenshots/ || true; test "$result" -eq 0
            bash android/decoder-check.sh false
      - name: Build and validate compact ARM64 delivery
        working-directory: android
        run: |
          gradle --no-daemon -PdeliveryArm64=true assembleDebug
          python3 - <<'PY'
          import zipfile,os
          p='app/build/outputs/apk/debug/app-debug.apk'
          assert os.path.getsize(p)<100*1024*1024,os.path.getsize(p)
          with zipfile.ZipFile(p) as z:
              libs=[x for x in z.infolist() if x.filename.startswith('lib/')]
              assert libs and all(x.filename.startswith('lib/arm64-v8a/') for x in libs)
              assert all(x.compress_type==zipfile.ZIP_DEFLATED for x in libs)
              assert 'assets/voice-cn-model.zip' in z.namelist()
              import hashlib
              assert hashlib.sha256(z.read('assets/voice-cn-model.zip')).hexdigest()=='3af8b0e7e0f835ae9d414ce5df580237a3cfb08d586c9fbbb0f7ff29ad5b14ba'
          PY
      - name: Preserve candidate APK
        run: |
          mkdir -p delivery
          cp android/app/build/outputs/apk/debug/app-debug.apk delivery/TogetherPlayer-Xiaomi-Pad7-0.6.60.14.apk
          (cd delivery && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-main10-http-recovery-0614
          path: |
            delivery/
            android-delivery/screenshots/
            android/app/build/reports/tests/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          retention-days: 7
