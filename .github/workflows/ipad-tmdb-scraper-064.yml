name: Verify and build iPad TMDB scraper 0.6.64
on:
  push:
    branches: [feat/ipad-tmdb-scraping-064-20261023]
    paths: ['ios/**', '.github/workflows/ipad-tmdb-scraper-064.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tmdb-scraper-ipad-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Generate native project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Resolve pinned dependencies
        run: |
          python3 tools/resolve_apple_packages.py -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -derivedDataPath build
          python3 tools/patch_prism_swift61.py build/SourcePackages/checkouts/PrismCore
      - name: Build physical iPad
        run: |
          set -o pipefail
          xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee tmdb-device-build.log
      - name: Verify scraper identity, poster identity, watch coverage and rotation
        run: |
          set -o pipefail
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if "iPad" in x["name"]))')"
          xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -configuration Debug -destination "platform=iOS Simulator,id=$device" -derivedDataPath build -resultBundlePath tmdb-tests.xcresult -parallel-testing-enabled NO -only-testing:TogetherPoCCoreTests/TMDBScraperTests -only-testing:TogetherPoCCoreTests/USBPlaylistCatalogTests -only-testing:TogetherPoCCoreTests/WatchAIRecommendationTests -only-testing:TogetherPoCCoreTests/ChatGPTRequestSupportTests -only-testing:TogetherPoCCoreTests/WatchMemoryTests -only-testing:TogetherPoCCoreTests/VideoRotationTests -only-testing:TogetherPoCUITests/WatchAIRecommendationUITests -only-testing:TogetherPoCUITests/WatchMemoryUITests -only-testing:TogetherPoCUITests/VideoRotationUITests CODE_SIGNING_ALLOWED=NO test 2>&1 | tee tmdb-tests.log

      - name: Package and verify IPA
        run: |
          python3 tools/package_unsigned_ipa.py build/Build/Products/Release-iphoneos/TogetherPoC.app delivery/TogetherPlayer-iPad-0.6.64-unsigned.ipa --notices ios/TogetherPoC.swiftpm/Licenses
          python3 - <<'PY'
          import plistlib,zipfile
          with zipfile.ZipFile('delivery/TogetherPlayer-iPad-0.6.64-unsigned.ipa') as z:
            i=plistlib.loads(z.read('Payload/TogetherPoC.app/Info.plist'))
            assert i['CFBundleShortVersionString']=='0.6.64' and str(i['CFBundleVersion'])=='124'
            assert 'Payload/TogetherPoC.app/film-catalog.json' in z.namelist()
          PY
          shasum -a 256 delivery/*.ipa > delivery/SHA256SUMS.txt
          printf 'Source: %s\nCI: https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > delivery/BUILD.txt
      - name: Publish verified installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create usb-tmdb-ipad-0.6.64-${{ github.run_id }} delivery/* --target "$GITHUB_SHA" --prerelease --title 'TogetherPlayer iPad 0.6.64 · TMDB 在线刮削预览' --notes 'Adds opt-in TMDB film and TV search, Chinese metadata, persistent poster caching, manual ambiguity review, secure on-device Keychain token, and bulk scraping UI. No TMDB token or personal data is embedded. Native build and selected simulator checks pass before publishing. Actual TMDB requests require a user-provided token and physical-device acceptance.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usb-tmdb-ipad-validation
          path: |
            delivery/
            tmdb-*.log
            tmdb-tests.xcresult
            watch-memory.png
