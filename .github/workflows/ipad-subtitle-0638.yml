name: Verify spare-subtitle priority and build iPad 0.6.38
on:
  push:
    branches:
      - fix/ipad-ai-material-subtitle-priority-20261016
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ipad-subtitle-0638-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ipad:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          set -euo pipefail
          for ver in 26.3 26.2 26.1.1 26.0.1; do
            dev="/Applications/Xcode_${ver}.app/Contents/Developer"
            if [ -d "$dev" ]; then sudo xcode-select -s "$dev"; xcodebuild -version; exit 0; fi
          done
          exit 1
      - name: Generate synthetic UHD HEVC Main10 MKV regression fixture
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then brew install ffmpeg; fi
          ffmpeg -nostdin -hide_banner -loglevel error -f lavfi -i 'testsrc2=size=3840x2160:rate=2:duration=16' \
            -c:v libx265 -preset ultrafast -pix_fmt yuv420p10le -threads 2 \
            -x265-params 'pools=1:frame-threads=1:wpp=0:keyint=24:min-keyint=24:bframes=0:log-level=error' \
            -an -y ios/NativeTests/Fixtures/bank-uhd10.mkv
          python3 -c 'import json,subprocess; f="ios/NativeTests/Fixtures/bank-uhd10.mkv"; v=json.loads(subprocess.check_output(["ffprobe","-v","error","-select_streams","v:0","-show_entries","stream=codec_name,width,height,pix_fmt","-of","json",f]))["streams"][0]; assert (v["codec_name"],v["width"],v["height"],v["pix_fmt"])==("hevc",3840,2160,"yuv420p10le"),v'
      - name: Prepare project and dependencies
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
          python3 tools/resolve_apple_packages.py -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -derivedDataPath local-copy-build
          python3 tools/patch_prism_swift61.py local-copy-build/SourcePackages/checkouts/PrismCore
      - name: Verify sync-engine regression
        run: |
          set -euo pipefail
          xcrun swiftc ios/TogetherPoC/SyncCore.swift ios/tests/SyncEngineRegression.swift -o /tmp/together-sync-check
          /tmp/together-sync-check
      - name: Build unsigned device Release
        run: |
          set -euo pipefail
          xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -configuration Release -destination 'generic/platform=iOS' -derivedDataPath local-copy-build CODE_SIGNING_ALLOWED=NO build
      - name: Boot iPad simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > /tmp/local-copy-devices.json
          DEVICE_ID=$(python3 -c 'import json; d=json.load(open("/tmp/local-copy-devices.json"))["devices"];print(next(x["udid"] for v in d.values() for x in v if "iPad" in x["name"]))')
          echo "SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Test subtitle priority, local import and film material safety
        run: |
          set -euo pipefail
          xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath local-copy-build CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -only-testing:TogetherPoCCoreTests/LocalMovieCopyStoreTests -only-testing:TogetherPoCCoreTests/FilmMaterialSafetyTests -only-testing:TogetherPoCCoreTests/FilmBankV2Tests test
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p local-copy-delivery
          python3 tools/package_unsigned_ipa.py local-copy-build/Build/Products/Release-iphoneos/TogetherPoC.app local-copy-delivery/TogetherPlayer-0.6.38-spare-subtitles-unsigned.ipa --notices ios/TogetherPoC.swiftpm/Licenses
          (cd local-copy-delivery && shasum -a 256 TogetherPlayer-0.6.38-spare-subtitles-unsigned.ipa > SHA256SUMS.txt)
          printf 'Source SHA: %s\nSource branch: %s\nDevice build and iPad simulator tests passed; original movie requires physical-device verification.\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > local-copy-delivery/BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TogetherPlayer-0.6.38-spare-subtitles
          path: local-copy-delivery/
          retention-days: 7
      - name: Publish verified unsigned IPA as direct prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.6.38-ipad-spare-subtitles-20261016"
          latest=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')
          test "$latest" = "$GITHUB_SHA" || { echo "Superseded source; refusing stale release"; exit 1; }
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Tag exists; refusing to overwrite"
            exit 1
          fi
          gh release create "$tag" \
            local-copy-delivery/TogetherPlayer-0.6.38-spare-subtitles-unsigned.ipa \
            local-copy-delivery/SHA256SUMS.txt \
            local-copy-delivery/BUILD.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "TogetherPlayer iPad 0.6.38 - AI spare subtitle priority" \
            --prerelease --notes "0.6.38 fixes manual external subtitle priority for AI material export, skips embedded rescans when spare subtitles were explicitly selected, displays the chosen source, invalidates stale previews, and includes persistent local-copy handling from 0.6.37. CI passes device compilation plus targeted native tests. Physical iPad original movie retest is still required. Same signing bundle. Android and production servers untouched."
