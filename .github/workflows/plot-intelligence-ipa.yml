name: Verify iPad first-use ChatGPT authorization fix
on:
  push:
    branches: [fix/plot-auth-first-use-offline-20261013]
    paths: ['.github/workflows/plot-intelligence-ipa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ipad:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Build unsigned iPad release
        run: |
          set -euo pipefail
          python3 tools/resolve_apple_packages.py -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -derivedDataPath plot-build
          python3 tools/patch_prism_swift61.py plot-build/SourcePackages/checkouts/PrismCore
          xcodebuild -project ios/TogetherPoC.xcodeproj -scheme TogetherPoC -configuration Release -destination 'generic/platform=iOS' -derivedDataPath plot-build CODE_SIGNING_ALLOWED=NO build
      - name: Package candidate with source identity
        run: |
          set -euo pipefail
          python3 tools/package_unsigned_ipa.py plot-build/Build/Products/Release-iphoneos/TogetherPoC.app plot-063-delivery/TogetherPlayer-v0.6.3-OAuth-first-use-unsigned.ipa --notices ios/TogetherPoC.swiftpm/Licenses
          shasum -a 256 plot-063-delivery/TogetherPlayer-v0.6.3-OAuth-first-use-unsigned.ipa > plot-063-delivery/SHA256SUMS.txt
          echo "Source branch: ${GITHUB_REF_NAME}" > plot-063-delivery/BUILD.txt
          echo "Source SHA: ${GITHUB_SHA}" >> plot-063-delivery/BUILD.txt
          echo "This is a candidate build; only iPad OAuth first-use and offline AI preview are changed. New poll protocol still requires a compatible server." >> plot-063-delivery/BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TogetherPlayer-iPad-v0.6.3-OAuth-first-use-fix
          path: plot-063-delivery/
          retention-days: 7
