name: Publish Android compatible subtitle fix
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish-download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require successful source build and native checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh run view 38299901772 --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
      - name: Assemble original-signer package
        run: |
          cat .delivery/android062/*.part > TogetherPlayer-Android-0.6.2.zip
          echo 'f765e025e4370c3f2adcc534767db046723294c87a503fe4fa2bdca6706a0af6  TogetherPlayer-Android-0.6.2.zip' | sha256sum -c -
          unzip TogetherPlayer-Android-0.6.2.zip
          sha256sum TogetherPlayer-Android-0.6.2.zip TogetherPlayer-Android-0.6.2.apk > SHA256SUMS.txt
      - name: Publish Android only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.6.2 TogetherPlayer-Android-0.6.2.zip TogetherPlayer-Android-0.6.2.apk SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target 331ab4130fb2beec706fda9221b0d97387d4c6f7 --title 'TogetherPlayer Android 0.6.2 · Plot polls and original chat timestamps' --notes 'Plot poll answers remain hidden until both room members submit. Chat shows original server timestamps. Local Apple Intelligence is used only on supported iPads; free templates are available otherwise. Server race checks and isolated/live two-peer protocol tests passed. Both clients require 0.6.2. ARM64 package retains original signer. Native regressions passed; physical Apple Intelligence has not been tested directly.' --prerelease
