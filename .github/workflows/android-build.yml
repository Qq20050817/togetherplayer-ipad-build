name: Build and check Android phone
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-build.yml']
permissions:
  contents: read
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify sync and subtitles, build APK
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify portrait, landscape and fullscreen on phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash android/voice-ui-check.sh
      - name: Collect native phone screenshots
        if: always()
        run: |
          mkdir -p android-delivery/screenshots
          cp android/app/build/outputs/apk/debug/app-debug.apk android-delivery/TogetherPlayer-0.5.0.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TogetherPlayer-Android-phone
          path: |
            android-delivery/
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
          retention-days: 7
