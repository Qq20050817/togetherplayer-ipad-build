name: Publish Android compatible subtitle fix
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish-download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require successful source build and native checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh run view 38317151006 --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
      - name: Assemble original-signer package
        run: |
          cat .delivery/android063/*.part > TogetherPlayer-Android-0.6.3-StoryTurn.zip
          echo '9574081b5dbb46cd11cbacf008c0c65e404e6e72b2cb841adc388886f6d9a436  TogetherPlayer-Android-0.6.3-StoryTurn.zip' | sha256sum -c -
          unzip TogetherPlayer-Android-0.6.3-StoryTurn.zip
          sha256sum TogetherPlayer-Android-0.6.3-StoryTurn.zip TogetherPlayer-Android-0.6.3-StoryTurn.apk > SHA256SUMS.txt
      - name: Publish Android only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.6.3-storyturn-preview-android TogetherPlayer-Android-0.6.3-StoryTurn.zip TogetherPlayer-Android-0.6.3-StoryTurn.apk SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target 0222a736fa025df22ddbbecb348bc56f256043e8 --title 'TogetherPlayer Android 0.6.3 · Story-turn questions' --notes 'Experimental Android client: automatically opens new blocking room questions and receives iPad-generated questions and optional plot metadata, candidate/custom answers remain hidden until both submit. No production deployment or service restart. Uses the original signer, ARM64, 45 unit tests and native regressions passed. iPad AI/OAuth require separate device validation. Existing0.6.2 server supports voting, but new metadata/history cutoff support requires a separately authorized server update.' --prerelease
