name: MovieMind Android native journal verification only
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: moviemind-android-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ORG_GRADLE_PROJECT_deliveryCompressedNative: 'true'
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Verify exact reviewed Android source
      run: 'test "$(git rev-parse HEAD:android)" = "7cc03bbef20d2176bd661946b4b57248605aa303"

        '
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
        cache-disabled: true
    - name: Bundle unchanged verified offline voice model
      run: 'mkdir -p android/app/src/main/assets

        curl -fL --retry 2 --max-time 180 https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip -o android/app/src/main/assets/voice-cn-model.zip

        echo ''3af8b0e7e0f835ae9d414ce5df580237a3cfb08d586c9fbbb0f7ff29ad5b14ba  android/app/src/main/assets/voice-cn-model.zip'' |
        sha256sum -c -

        '
    - name: Run real JVM tests and compile native app and tests
      working-directory: android
      run: gradle --no-daemon --max-workers=2 testDebugUnitTest assembleDebug assembleDebugAndroidTest
    - name: Enable standard hosted emulator acceleration
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - name: Verify native journal and preserved HDR local-source room regressions
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        arch: x86_64
        profile: pixel_6
        disable-animations: true
        script: 'python3 android/emulator-preflight.py

          gradle -p android --no-daemon --max-workers=2 connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=''dev.together.poc.MovieMindNativeJournalInstrumentedTest,dev.together.poc.MovieMindIsolationInstrumentedTest,dev.together.poc.HevcHardwareInitializationTest,dev.together.poc.LocalDocumentPlaybackTest,dev.together.poc.LocalFirstHttpTest,dev.together.poc.LocalVariantTest,dev.together.poc.RoomSessionStabilityTest,dev.together.poc.WatchMemoryPersistenceTest''

          '
    - name: Require actual non-skipped JVM and native counts
      if: always()
      run: "python3 - <<'PYCHECK'\nfrom pathlib import Path\nimport xml.etree.ElementTree as ET,json\nfor kind,pattern,expected in [('jvm','app/build/test-results/testDebugUnitTest/TEST-*.xml',173),('native','app/build/outputs/androidTest-results/connected/**/*.xml',31)]:\n\
        \ rows=list(Path('android').glob(pattern))\n total={'tests':0,'failures':0,'errors':0,'skipped':0}\n for p in rows:\n  r=ET.parse(p).getroot()\n\
        \  for suite in ([r] if r.tag=='testsuite' else list(r.iter('testsuite'))):\n   for key in total:total[key]+=int(suite.get(key,'0'))\n\
        \ print('::notice title=Actual '+kind+' test counts::'+json.dumps(total))\n assert total['tests']==expected and total['failures']==0\
        \ and total['errors']==0 and total['skipped']==0,(kind,total)\nPYCHECK\n"
