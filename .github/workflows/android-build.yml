name: Build and check Android phone
on:
  workflow_dispatch:
    inputs:
      main10_probe:
        type: boolean
        default: false
        description: Verify independent 4K Main10 decoder only
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-build.yml']
permissions:
  contents: read
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle verified offline Chinese speech model
        run: |
          mkdir -p android/app/src/main/assets
          curl -fL --retry 2 --max-time 180 https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip -o android/app/src/main/assets/voice-cn-model.zip
          echo '3af8b0e7e0f835ae9d414ce5df580237a3cfb08d586c9fbbb0f7ff29ad5b14ba  android/app/src/main/assets/voice-cn-model.zip' | sha256sum -c -
      - name: Verify sync and subtitles, build APK
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify portrait, landscape and fullscreen on phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            if [ "${{ inputs.main10_probe }}" = true ]; then
              adb install -r android/app/build/outputs/apk/debug/app-debug.apk
              cd android
              gradle --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.together.poc.Main10DecoderTest
            else
              bash android/voice-ui-check.sh
            fi
      - name: Collect native phone screenshots
        if: always()
        run: |
          mkdir -p android-delivery/screenshots
          cp android/app/build/outputs/apk/debug/app-debug.apk android-delivery/TogetherPlayer-0.5.7.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TogetherPlayer-Android-phone
          path: |
            android-delivery/
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
          retention-days: 7

      - name: Preserve native test reports separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-native-validation
          path: |
            android-delivery/screenshots/
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
          retention-days: 7
