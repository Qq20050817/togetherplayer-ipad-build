name: Publish Android compatible subtitle fix
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish-download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require successful source build and native checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh run view 38309886206 --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
      - name: Assemble original-signer package
        run: |
          cat .delivery/android063/*.part > TogetherPlayer-Android-0.6.3.zip
          echo '88f890b3a583c14a0917eacd233f3b47d088bab8e317514e6cd934da2e5db6e9  TogetherPlayer-Android-0.6.3.zip' | sha256sum -c -
          unzip TogetherPlayer-Android-0.6.3.zip
          sha256sum TogetherPlayer-Android-0.6.3.zip TogetherPlayer-Android-0.6.3.apk > SHA256SUMS.txt
      - name: Publish Android only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.6.3-plot-ai-preview-android TogetherPlayer-Android-0.6.3.zip TogetherPlayer-Android-0.6.3.apk SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target 13dd33a1b8bd1c0c13278b2c0f32e174077eb6b0 --title 'TogetherPlayer Android 0.6.3 · AI plot preview' --notes 'Experimental Android client: receives iPad-generated questions and optional plot metadata, candidate/custom answers remain hidden until both submit. No production deployment or service restart. Uses the original signer, ARM64, 45 unit tests and native regressions passed. iPad AI/OAuth require separate device validation. Existing0.6.2 server supports voting, but new metadata/history cutoff support requires a separately authorized server update.' --prerelease
