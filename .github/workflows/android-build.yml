name: Build and check Android phone
on:
  workflow_dispatch:
    inputs:
      main10_probe:
        type: boolean
        default: false
        description: Verify independent 4K Main10 decoder only
  push:
    branches: [main, fix/fullscreen-brightness-swipe-20261012, release/v0.6.1-fullscreen-exit-20261013 , feat/plot-polls-local-ai-20261013, fix/plot-seamless-autoprompt-20261013, fix/android-local-mov-container-fallback-20261014, fix/android-playback-recovery-20261014, fix/android-full-plot-question-20261014, feat/android-usb-http-library-20261022, fix/android-local-source-reconnect-seek-20261023, fix/android-local-buffer-binding-0604-20261023, fix/android-http-play-retry-0605-20261024]
    paths: ['android/**', '.github/workflows/android-build.yml']
permissions:
  contents: read
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle verified offline Chinese speech model
        run: |
          mkdir -p android/app/src/main/assets
          curl -fL --retry 2 --max-time 180 https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip -o android/app/src/main/assets/voice-cn-model.zip
          echo '3af8b0e7e0f835ae9d414ce5df580237a3cfb08d586c9fbbb0f7ff29ad5b14ba  android/app/src/main/assets/voice-cn-model.zip' | sha256sum -c -
      - name: Verify sync and subtitles, build APK
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify portrait, landscape and fullscreen on phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash android/decoder-check.sh '${{ inputs.main10_probe }}'
      - name: Collect native phone screenshots
        if: always()
        run: |
          mkdir -p android-delivery/screenshots
          if test -f android/app/build/outputs/apk/debug/app-debug.apk; then
            if [ "$GITHUB_REF_NAME" = "fix/android-http-play-retry-0605-20261024" ]; then
              filename=TogetherPlayer-Android-0.6.60.5-HttpTapRecovery.apk
              printf 'Source SHA: %s\nAndroid: 0.6.60.5\nScope: preserve local film across reconnect, retry failed HTTP/local ExoPlayer on main play tap without pausing the peer.\nValidation: CI and emulator; actual network and dual-device playback need acceptance.\n' "$GITHUB_SHA" > android-delivery/BUILD.txt
            elif [ "$GITHUB_REF_NAME" = "fix/android-local-buffer-binding-0604-20261023" ]; then
              filename=TogetherPlayer-Android-0.6.60.4-LocalBinding.apk
              printf 'Source SHA: %s\nAndroid: 0.6.60.4\nScope: persist Android local SAF video binding across app restarts; prevent silent HTTP fallback; include source-type diagnostics.\nValidation: CI/emulator; dual-device playback still requires acceptance.\n' "$GITHUB_SHA" > android-delivery/BUILD.txt
            elif [ "$GITHUB_REF_NAME" = "fix/android-local-source-reconnect-seek-20261023" ]; then
              filename=TogetherPlayer-Android-0.6.60.1-LocalSourceRecovery.apk
              printf 'Source SHA: %s\nAndroid: 0.6.60.1\nScope: retain local source after signed URL renewal; recover local seek-buffer stall.\nValidation: CI and emulator; dual-device runtime check pending.\n' "$GITHUB_SHA" > android-delivery/BUILD.txt
            elif [ "$GITHUB_REF_NAME" = "feat/android-usb-http-library-20261022" ]; then
              filename=TogetherPlayer-Android-0.6.55-USB-HTTP.apk
              printf 'Source SHA: %s\nAndroid: 0.6.55\nScope: iPad-only room selection, Android local media override retained, unsigned USB subtitles.\nValidation: Android CI; dual-device real media still needs on-device verification.\n' "$GITHUB_SHA" > android-delivery/BUILD.txt
            else
              filename=TogetherPlayer-Android-0.6.6-PlotQuestion-FullText.apk
              printf 'Source SHA: %s\nAndroid: 0.6.6\nScope: keep Android 0.6.5 fixes; display full plot question as scrollable dialog body, support prediction labels.\nValidation: Android CI plus emulator; real 4K MOV and dual-device playback not yet verified.\n' "$GITHUB_SHA" > android-delivery/BUILD.txt
            fi
            cp android/app/build/outputs/apk/debug/app-debug.apk "android-delivery/$filename"
            (cd android-delivery && sha256sum "$filename" > SHA256SUMS.txt)
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TogetherPlayer-Android-phone
          path: |
            android-delivery/
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
          retention-days: 7

      - name: Preserve native test reports separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-native-validation
          path: |
            android-delivery/screenshots/
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
          retention-days: 7

  release-verified-android:
    name: Publish direct experimental APK (no ZIP)
    needs: android-build
    if: ${{ success() && github.ref_name == 'fix/android-full-plot-question-20261014' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Verify current-run APK checksum and commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verified
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name TogetherPlayer-Android-phone --dir verified
          # Artifact upload keeps its android-delivery/ subdirectory on some runners.
          build_report="$(find verified -type f -name BUILD.txt -print -quit)"
          test -n "$build_report"
          archive_dir="$(dirname "$build_report")"
          grep -Fx "Source SHA: $GITHUB_SHA" "$build_report"
          (cd "$archive_dir" && sha256sum -c SHA256SUMS.txt)
          test -s "$archive_dir/TogetherPlayer-Android-0.6.6-PlotQuestion-FullText.apk"
          mkdir -p release-files
          cp "$archive_dir/TogetherPlayer-Android-0.6.6-PlotQuestion-FullText.apk" "$archive_dir/BUILD.txt" "$archive_dir/SHA256SUMS.txt" release-files/
      - name: Release direct APK only after all tests pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.6.6-plot-full-question-android-preview"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Tag already exists; refusing to overwrite existing assets." >&2
            exit 1
          fi
          gh release create "$tag" \
            release-files/TogetherPlayer-Android-0.6.6-PlotQuestion-FullText.apk \
            release-files/BUILD.txt release-files/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "TogetherPlayer Android 0.6.6 - Full plot question and prediction UI (experimental)" \
            --notes "Experimental direct APK, no ZIP. Based on the last verified Android 0.6.4 local MOV compatible playback. Preserves 0.6.5 synchronized speed/recovery. Fixes truncated plot poll question titles on Android by showing long questions in a scrollable body, with prediction hints and unchanged vote flow. Emulator CI verification; two real devices and all high-bitrate sources require acceptance. Existing iPad/server/router services unchanged."

  release-usb-viewer:
    name: Publish USB HTTP Android APK after complete verification
    needs: android-build
    if: ${{ success() && github.ref_name == 'feat/android-usb-http-library-20261022' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Verify source commit and packaged APK checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verified
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name TogetherPlayer-Android-phone --dir verified
          report="$(find verified -type f -name BUILD.txt -print -quit)"
          test -n "$report"
          folder="$(dirname "$report")"
          grep -Fx "Source SHA: $GITHUB_SHA" "$report"
          grep -Fx "Android: 0.6.55" "$report"
          (cd "$folder" && sha256sum -c SHA256SUMS.txt)
          test -s "$folder/TogetherPlayer-Android-0.6.55-USB-HTTP.apk"
          mkdir -p release-files
          cp "$folder/TogetherPlayer-Android-0.6.55-USB-HTTP.apk" "$folder/BUILD.txt" "$folder/SHA256SUMS.txt" release-files/
      - name: Create standalone APK prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="android-v0.6.55-usb-http-viewer-preview-20261022"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Tag already exists; refusing to overwrite previously published assets." >&2
            exit 1
          fi
          gh release create "$tag" \
            release-files/TogetherPlayer-Android-0.6.55-USB-HTTP.apk \
            release-files/BUILD.txt release-files/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "TogetherPlayer Android 0.6.55 · USB HTTP viewer" \
            --notes "Direct APK, no ZIP. Android joins room and loads the iPad owner's HTTP movie automatically; local video and alternative HTTP sources remain selectable per device, with no Android room-media publication. CI and emulator tests pass; dual-device actual media needs confirmation. Existing router/media services unchanged."

  release-local-source-recovery:
    name: Publish direct Android local-source recovery APK
    needs: android-build
    if: ${{ success() && github.ref_name == 'fix/android-local-source-reconnect-seek-20261023' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check tested APK identity and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verified release-files
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name TogetherPlayer-Android-phone --dir verified
          report="$(find verified -type f -name BUILD.txt -print -quit)"
          test -n "$report"
          archive_dir="$(dirname "$report")"
          grep -Fx "Source SHA: $GITHUB_SHA" "$report"
          grep -Fx 'Android: 0.6.60.1' "$report"
          (cd "$archive_dir" && sha256sum -c SHA256SUMS.txt)
          test -s "$archive_dir/TogetherPlayer-Android-0.6.60.1-LocalSourceRecovery.apk"
          cp "$archive_dir/TogetherPlayer-Android-0.6.60.1-LocalSourceRecovery.apk" "$archive_dir/BUILD.txt" "$archive_dir/SHA256SUMS.txt" release-files/
      - name: Publish immutable preview without replacing existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="android-local-source-0.6.60.1-$GITHUB_RUN_ID"
          gh release create "$tag" release-files/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'Android 0.6.60.1 local file recovery preview' --notes 'Preserve selected Android local film after signed HTTP link renewal and restore playback after seek buffering. Existing services unchanged. GitHub CI passed; real iPad plus Android synchronization requires verification.'

  release-local-binding-0604:
    name: Publish Android local-binding preview APK directly
    needs: android-build
    if: ${{ success() && github.ref_name == 'fix/android-local-buffer-binding-0604-20261023' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download and verify exact tested artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verified release-files
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name TogetherPlayer-Android-phone --dir verified
          report="$(find verified -type f -name BUILD.txt -print -quit)"
          test -n "$report"
          archive_dir="$(dirname "$report")"
          grep -Fx "Source SHA: $GITHUB_SHA" "$report"
          grep -Fx 'Android: 0.6.60.4' "$report"
          (cd "$archive_dir" && sha256sum -c SHA256SUMS.txt)
          test -s "$archive_dir/TogetherPlayer-Android-0.6.60.4-LocalBinding.apk"
          cp "$archive_dir/TogetherPlayer-Android-0.6.60.4-LocalBinding.apk" "$archive_dir/BUILD.txt" "$archive_dir/SHA256SUMS.txt" release-files/
      - name: Publish immutable direct APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "android-local-binding-0.6.60.4-$GITHUB_RUN_ID" release-files/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'TogetherPlayer Android 0.6.60.4 local movie binding preview' --notes 'Preserves SAF local selection across app restarts, blocks silent HTTP fallback when read permission has expired, and identifies effective playback source. CI and emulator verified, real two-device playback requires acceptance. Server and router unchanged.'

  release-http-tap-recovery-0605:
    name: Publish direct Android HTTP retry preview APK
    needs: android-build
    if: ${{ success() && github.ref_name == 'fix/android-http-play-retry-0605-20261024' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Confirm this commit, version and APK checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verified release-files
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name TogetherPlayer-Android-phone --dir verified
          report="$(find verified -type f -name BUILD.txt -print -quit)"
          test -n "$report"
          archive_dir="$(dirname "$report")"
          grep -Fx "Source SHA: $GITHUB_SHA" "$report"
          grep -Fx 'Android: 0.6.60.5' "$report"
          (cd "$archive_dir" && sha256sum -c SHA256SUMS.txt)
          test -s "$archive_dir/TogetherPlayer-Android-0.6.60.5-HttpTapRecovery.apk"
          cp "$archive_dir/TogetherPlayer-Android-0.6.60.5-HttpTapRecovery.apk" "$archive_dir/BUILD.txt" "$archive_dir/SHA256SUMS.txt" release-files/
      - name: Publish immutable direct APK after CI validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "android-http-tap-0.6.60.5-$GITHUB_RUN_ID" release-files/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'TogetherPlayer Android 0.6.60.5 HTTP playback tap recovery' --notes 'Direct APK preview. Fixes Android Play tap when HTTP ExoPlayer is idle, timed out or buffering, retaining the healthy iPad room state; preserves version 0.6.60.4 local SAF movie source recovery. CI emulator verifies build and UI; actual dual-device HTTP throughput and stability still require on-device acceptance. Existing server/router/iPad unchanged.'
